mount":"120 克","group":"主料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"老抽","amount":"少许","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"蒜末","amount":"2 瓣","group":"调料"}],"steps":["蒜苔掐去老根切段，沸水焯 40 秒捞出。","五花肉切薄片，冷锅小火煸到出油、边缘微卷。","下蒜末炒香，淋老抽上色。","倒蒜苔大火炒 1 分半，加生抽和盐翻匀出锅。"],"tips":"蒜苔不焯水就得炒很久，焯 40 秒既断生又保住脆感。","id":"pork-06","source":"内置菜谱"},{"name":"土豆炒肉丝","category":"pork","kind":"荤","minutes":20,"difficulty":1,"spicy":1,"tags":["家常","下饭","便宜"],"ingredients":[{"name":"土豆","amount":"2 个","group":"主料"},{"name":"猪里脊","amount":"150 克","group":"主料"},{"name":"青椒","amount":"1 个","group":"主料"},{"name":"蒜末","amount":"2 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"白醋","amount":"半勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"}],"steps":["土豆切细丝，清水冲两遍洗掉淀粉，泡水备用。","里脊切丝，加生抽、淀粉腌 10 分钟。","热油滑炒肉丝至变色盛出。","下蒜末、土豆丝大火炒 2 分钟，沿锅边淋白醋。","回肉丝和青椒丝，调盐炒匀出锅。"],"tips":"土豆丝洗掉表面淀粉才不粘锅，白醋要在下锅 early 淋，脆度全靠它。","id":"pork-07","source":"内置菜谱"},{"name":"韭黄炒肉丝","category":"pork","kind":"荤","minutes":15,"difficulty":1,"spicy":1,"tags":["快手","家常"],"ingredients":[{"name":"韭黄","amount":"250 克","group":"主料"},{"name":"猪里脊","amount":"150 克","group":"主料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["韭黄洗净沥干，切 4 厘米段，根部和叶子分开放。","里脊切丝，加生抽、淀粉、少许油腌 10 分钟。","热油下肉丝滑散至变色。","先下韭黄根部炒 20 秒，再下叶子，全程大火不超过 40 秒。","调盐快速翻匀，立刻出锅。"],"tips":"韭黄遇热就软，叶子最后下、盐最后放，早放盐会出一盘水。","id":"pork-08","source":"内置菜谱"},{"name":"杭椒小炒肉","category":"pork","kind":"荤","minutes":18,"difficulty":2,"spicy":2,"tags":["下饭","湘菜","重口"],"ingredients":[{"name":"杭椒","amount":"200 克","group":"主料"},{"name":"五花肉","amount":"180 克","group":"主料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"豆豉","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"蚝油","amount":"半勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["杭椒斜切段，用刀背轻拍一下更入味；五花肉切薄片。","干锅不放油，下杭椒中火煸到表皮起虎皮，盛出。","下五花肉小火煸出油，边缘微焦时加蒜片、豆豉炒香。","淋料酒、生抽、蚝油，倒回杭椒大火翻 30 秒。"],"tips":"杭椒先干煸出虎皮，辣味变香不冲，这是湘菜小炒的关键一步。","id":"pork-09","source":"内置菜谱"},{"name":"回锅肉","category":"pork","kind":"荤","minutes":45,"difficulty":3,"spicy":2,"tags":["川菜","经典","下饭"],"ingredients":[{"name":"带皮五花肉","amount":"400 克","group":"主料"},{"name":"青蒜","amount":"100 克","group":"主料"},{"name":"青椒","amount":"1 个","group":"主料"},{"name":"郫县豆瓣","amount":"1.5 勺","group":"调料"},{"name":"豆豉","amount":"1 勺","group":"调料"},{"name":"甜面酱","amount":"半勺","group":"调料"},{"name":"生抽","amount":"半勺","group":"调料"},{"name":"白糖","amount":"少许","group":"调料"},{"name":"姜片","amount":"3 片","group":"调料"},{"name":"花椒","amount":"10 粒","group":"调料"}],"steps":["整块五花肉冷水下锅，加姜片、花椒、1 勺料酒，煮 20 分钟至筷子能扎透，捞出放凉。","肉切成 2 毫米薄片，越薄越好；青蒜斜切段，蒜白蒜叶分开。","锅烧热放少许油，下肉片中火煸炒，炒到肉片卷成\"灯盏窝\"、油被逼出。","拨开肉片，下豆瓣、豆豉、甜面酱小火炒出红油。","加生抽、少许糖，倒青椒和蒜白炒 1 分钟，最后下蒜叶，翻两下出锅。"],"tips":"肉要煮到七成熟再切，凉了才好切薄；煸出灯盏窝才不腻。","id":"pork-10","source":"内置菜谱"},{"name":"盐煎肉","category":"pork","kind":"荤","minutes":20,"difficulty":2,"spicy":2,"tags":["川菜","下饭"],"ingredients":[{"name":"五花肉","amount":"250 克","group":"主料"},{"name":"蒜苗","amount":"100 克","group":"主料"},{"name":"青椒","amount":"1 个","group":"主料"},{"name":"郫县豆瓣","amount":"1 勺","group":"调料"},{"name":"豆豉","amount":"半勺","group":"调料"},{"name":"生抽","amount":"半勺","group":"调料"},{"name":"白糖","amount":"少许","group":"调料"}],"steps":["五花肉切薄片，蒜苗斜切段。","锅不放油，下肉片中小火慢煎，煎到两面微黄、油分析出。","拨到一边，下豆瓣、豆豉炒出红油。","加生抽、少许糖翻匀，下青椒和蒜苗大火炒 1 分钟。"],"tips":"盐煎肉不焯水不煮，全靠干煎出油，锅一定要厚底才不糊。","id":"pork-11","source":"内置菜谱"},{"name":"农家小炒肉","category":"pork","kind":"荤","minutes":20,"difficulty":2,"spicy":3,"tags":["湘菜","重口","下饭"],"ingredients":[{"name":"五花肉","amount":"150 克","group":"主料"},{"name":"前腿肉","amount":"100 克","group":"主料"},{"name":"螺丝椒","amount":"200 克","group":"主料"},{"name":"蒜片","amount":"4 瓣","group":"调料"},{"name":"豆豉","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"老抽","amount":"少许","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["两种肉都切薄片，前腿肉加少许生抽抓匀。","螺丝椒斜切，干锅煸到表皮起皱，撒一点盐盛出。","下五花肉煸出油，再下前腿肉炒散。","加蒜片、豆豉炒香，淋老抽上色。","倒回辣椒，加生抽大火翻 30 秒出锅。"],"tips":"两种肉分工：五花出油、前腿出嫩，只用一种味道就单薄。","id":"pork-12","source":"内置菜谱"},{"name":"红烧肉","category":"pork","kind":"荤","minutes":80,"difficulty":2,"spicy":1,"tags":["经典","宴客","下饭"],"ingredients":[{"name":"带皮五花肉","amount":"600 克","group":"主料"},{"name":"冰糖","amount":"30 克","group":"调料"},{"name":"生抽","amount":"3 勺","group":"调料"},{"name":"老抽","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"3 勺","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"葱段","amount":"2 段","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"桂皮","amount":"1 小块","group":"调料"}],"steps":["五花肉切 3 厘米方块，冷水下锅加姜片、料酒焯 5 分钟，捞出用温水洗净。","锅里放少许油和冰糖，小火炒到枣红色冒小泡，立刻下肉块翻炒上色。","加姜葱、八角、桂皮炒香，淋料酒、生抽、老抽。","倒热水没过肉，大火烧开转小火炖 50 分钟。","开盖转大火收汁，边收边翻，汁浓稠挂肉即可。"],"tips":"炒糖色宁浅勿深，发黑就苦；一定要加热水，冷水会让肉紧住。","id":"pork-13","source":"内置菜谱"},{"name":"红烧排骨","category":"pork","kind":"荤","minutes":60,"difficulty":2,"spicy":1,"tags":["经典","下饭"],"ingredients":[{"name":"肋排","amount":"600 克","group":"主料"},{"name":"冰糖","amount":"25 克","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"八角","amount":"1 个","group":"调料"},{"name":"香叶","amount":"2 片","group":"调料"}],"steps":["排骨斩段，冷水浸泡 20 分钟去血水，再冷水下锅焯 3 分钟。","锅中少油下冰糖，小火炒出糖色，倒排骨翻炒上色。","加姜片、八角、香叶炒香，淋料酒、生抽、老抽。","加热水没过排骨，小火炖 35 分钟。","大火收汁到浓稠，撒白芝麻。"],"tips":"排骨先泡水再焯，汤才清；收汁时勤翻，糖分容易糊底。","id":"pork-14","source":"内置菜谱"},{"name":"红烧猪蹄","category":"pork","kind":"荤","minutes":110,"difficulty":2,"spicy":1,"tags":["宴客","胶原","下饭"],"ingredients":[{"name":"猪蹄","amount":"2 只","group":"主料"},{"name":"冰糖","amount":"30 克","group":"调料"},{"name":"生抽","amount":"3 勺","group":"调料"},{"name":"老抽","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"3 勺","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"桂皮","amount":"1 块","group":"调料"},{"name":"干辣椒","amount":"3 个","group":"调料"}],"steps":["猪蹄剁块，冷水下锅加姜片、料酒焯 5 分钟，拔净残毛。","少油炒冰糖至枣红，下猪蹄翻炒上色。","加香料炒香，淋料酒、生抽、老抽。","加热水没过，小火炖 90 分钟（高压锅 25 分钟）。","开盖大火收汁，汤汁黏亮即可。"],"tips":"想省时间用高压锅压 25 分钟，再倒回炒锅收汁，胶质一样浓。","id":"pork-15","source":"内置菜谱"},{"name":"红烧狮子头","category":"pork","kind":"荤","minutes":90,"difficulty":3,"spicy":0,"tags":["宴客","淮扬菜","经典"],"ingredients":[{"name":"猪前腿肉","amount":"500 克","group":"主料"},{"name":"荸荠","amount":"6 个","group":"主料"},{"name":"鸡蛋","amount":"1 个","group":"主料"},{"name":"小青菜","amount":"4 棵","group":"主料"},{"name":"姜葱水","amount":"4 勺","group":"调料"},{"name":"淀粉","amount":"2 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["前腿肉肥三瘦七，先切丁再粗剁成石榴粒大小，别剁成泥。","加荸荠碎、鸡蛋、姜葱水、淀粉、盐、料酒，顺一个方向搅到上劲、能挂住手。","手掌来回摔打 20 下排气，团成 4 个大丸子。","六成热油下丸子，中火炸到表面金黄定型，捞出。","砂锅垫姜葱，放丸子，加生抽、老抽、热水至丸子一半高，小火炖 50 分钟。","起锅前放焯过水的小青菜，收一点汁浇上。"],"tips":"肉要粗剁保留颗粒，摔打上劲才松而不散，全程小火炖不翻动。","id":"pork-16","source":"内置菜谱"},{"name":"梅菜扣肉","category":"pork","kind":"荤","minutes":130,"difficulty":3,"spicy":0,"tags":["宴客","客家菜","经典"],"ingredients":[{"name":"带皮五花肉","amount":"600 克","group":"主料"},{"name":"梅干菜","amount":"80 克","group":"主料"},{"name":"小青菜","amount":"4 棵","group":"主料"},{"name":"老抽","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"冰糖","amount":"15 克","group":"调料"},{"name":"八角","amount":"1 个","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"}],"steps":["梅干菜温水泡 30 分钟，反复洗掉沙子，挤干水分。","整块五花肉冷水下锅煮 20 分钟，捞出趁热在皮上抹老抽。","皮朝下入六成热油，炸到起泡呈虎皮状（会溅油，盖锅盖留缝），捞出泡冷水 10 分钟。","肉切 5 毫米厚片，皮朝下码进碗里，铺上炒香的梅干菜，加生抽、冰糖、八角、姜片。","上锅蒸 90 分钟，倒扣在盘里，配焯水青菜。"],"tips":"炸皮后泡冷水，虎皮才会起皱吸汁；蒸的时间别省，越久越化。","id":"pork-17","source":"内置菜谱"},{"name":"粉蒸肉","category":"pork","kind":"荤","minutes":80,"difficulty":2,"spicy":1,"tags":["川菜","家常","一锅出"],"ingredients":[{"name":"五花肉","amount":"400 克","group":"主料"},{"name":"蒸肉米粉","amount":"100 克","group":"主料"},{"name":"红薯","amount":"1 个","group":"主料"},{"name":"郫县豆瓣","amount":"1 勺","group":"调料"},{"name":"腐乳汁","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"姜末","amount":"1 勺","group":"调料"},{"name":"花椒粉","amount":"少许","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["五花肉切 5 毫米厚片，加豆瓣、腐乳汁、生抽、姜末、料酒抓匀腌 20 分钟。","分次撒蒸肉米粉拌匀，让每片肉都裹上粉，太干就加 2 勺水。","红薯切厚片铺碗底，肉片码在上面。","上锅大火上汽后转中火蒸 60 分钟。","出锅撒花椒粉和葱花。"],"tips":"米粉分次加、边加边拌，一次倒进去会结块；碗底垫红薯能吸油。","id":"pork-18","source":"内置菜谱"},{"name":"酱肘子","category":"pork","kind":"荤","minutes":120,"difficulty":3,"spicy":1,"tags":["宴客","卤味","硬菜"],"ingredients":[{"name":"猪肘","amount":"1 个","group":"主料"},{"name":"黄豆酱","amount":"2 勺","group":"调料"},{"name":"甜面酱","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"3 勺","group":"调料"},{"name":"冰糖","amount":"20 克","group":"调料"},{"name":"料酒","amount":"3 勺","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"桂皮","amount":"1 块","group":"调料"},{"name":"香叶","amount":"3 片","group":"调料"}],"steps":["猪肘用火燎一遍表皮去毛腥，刮洗干净，冷水下锅焯 5 分钟。","锅中少油，下黄豆酱、甜面酱小火炒香。","加冰糖、生抽、料酒、香料和足量热水烧开。","放猪肘，小火炖 90 分钟，中途翻面两次。","关火在汤里泡 30 分钟再捞出，切片浇汁。"],"tips":"关火后泡半小时比多炖半小时更入味，肉也不散。","id":"pork-19","source":"内置菜谱"},{"name":"东坡肉","category":"pork","kind":"荤","minutes":150,"difficulty":3,"spicy":0,"tags":["经典","宴客","浙菜"],"ingredients":[{"name":"带皮五花肉","amount":"800 克","group":"主料"},{"name":"黄酒","amount":"500 毫升","group":"调料"},{"name":"冰糖","amount":"60 克","group":"调料"},{"name":"生抽","amount":"3 勺","group":"调料"},{"name":"老抽","amount":"1 勺","group":"调料"},{"name":"姜片","amount":"6 片","group":"调料"},{"name":"葱","amount":"1 把","group":"调料"}],"steps":["五花肉整块焯水 5 分钟，切成 5 厘米见方的大块，用棉线十字捆好。","砂锅底铺满葱段和姜片，肉皮朝下码好。","加冰糖、生抽、老抽，倒黄酒至没过肉的三分之二，不加水。","大火烧开转最小火焖 90 分钟，翻面再焖 30 分钟。","肉移到碗里皮朝上，淋原汁，上锅再蒸 30 分钟。"],"tips":"全程用黄酒不加水，酒香才透；捆线是为了炖完还成方块。","id":"pork-20","source":"内置菜谱"},{"name":"黄焖排骨","category":"pork","kind":"荤","minutes":55,"difficulty":2,"spicy":1,"tags":["家常","下饭"],"ingredients":[{"name":"肋排","amount":"500 克","group":"主料"},{"name":"香菇","amount":"6 朵","group":"主料"},{"name":"青椒","amount":"1 个","group":"主料"},{"name":"黄豆酱","amount":"1.5 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"冰糖","amount":"10 克","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"蒜","amount":"4 瓣","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"}],"steps":["排骨冷水下锅焯 3 分钟，捞出沥干；香菇泡发切块，泡菇水留着。","少油炒冰糖至微黄，下排骨翻炒上色。","加姜蒜、黄豆酱炒香，淋料酒、生抽。","倒泡菇水和热水没过排骨，放香菇，小火焖 30 分钟。","下青椒块，大火收汁到浓稠。"],"tips":"泡香菇的水是这道菜的鲜味来源，沉淀后取上层用。","id":"pork-21","source":"内置菜谱"},{"name":"闷五花肉","category":"pork","kind":"荤","minutes":60,"difficulty":2,"spicy":1,"tags":["家常","下饭","一锅出"],"ingredients":[{"name":"五花肉","amount":"500 克","group":"主料"},{"name":"土豆","amount":"2 个","group":"主料"},{"name":"青椒","amount":"1 个","group":"主料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"冰糖","amount":"10 克","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"八角","amount":"1 个","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"}],"steps":["五花肉切麻将块，冷水下锅焯 3 分钟。","干锅下肉块小火煸出油，加冰糖炒到微黄。","加姜片、八角炒香，淋料酒、生抽、老抽。","加热水没过肉，小火焖 25 分钟。","放土豆块再焖 15 分钟，最后下青椒，大火收汁。"],"tips":"土豆后放，焖 15 分钟刚好粉而不烂，早放会化成泥。","id":"pork-22","source":"内置菜谱"},{"name":"排骨汤","category":"pork","kind":"汤","minutes":80,"difficulty":1,"spicy":0,"tags":["清淡","汤水","滋补"],"ingredients":[{"name":"肋排","amount":"500 克","group":"主料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"葱段","amount":"1 段","group":"调料"},{"name":"枸杞","amount":"10 粒","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["排骨冷水浸泡 30 分钟去血水，中途换一次水。","冷水下锅，加姜片、料酒，水开后撇净浮沫，煮 2 分钟捞出用温水冲净。","排骨放砂锅，加足量热水、姜片、葱段，大火烧开转小火炖 60 分钟。","出锅前 5 分钟放枸杞，只加盐调味。"],"tips":"中途别加冷水，一次加够热水，汤才清甜不腥。","id":"pork-23","source":"内置菜谱"},{"name":"莲藕排骨汤","category":"pork","kind":"汤","minutes":100,"difficulty":1,"spicy":0,"tags":["汤水","湖北","滋补"],"ingredients":[{"name":"肋排","amount":"500 克","group":"主料"},{"name":"莲藕","amount":"500 克","group":"主料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["排骨冷水下锅焯水，撇沫后捞出洗净。","莲藕去皮切滚刀块，泡在清水里防氧化。","排骨、姜片入砂锅，加足热水，大火烧开转小火炖 40 分钟。","下莲藕再炖 40 分钟，至藕粉糯。","只加盐调味，撒葱花。"],"tips":"选七孔藕（短粗、皮黄）才粉糯，九孔藕适合清炒。","id":"pork-24","source":"内置菜谱"},{"name":"玉米排骨汤","category":"pork","kind":"汤","minutes":80,"difficulty":1,"spicy":0,"tags":["汤水","清甜","孩子爱吃"],"ingredients":[{"name":"肋排","amount":"500 克","group":"主料"},{"name":"甜玉米","amount":"2 根","group":"主料"},{"name":"胡萝卜","amount":"1 根","group":"主料"},{"name":"姜片","amount":"3 片","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["排骨焯水洗净；玉米切段，胡萝卜切滚刀块。","全部材料加姜片放入砂锅，倒足量热水。","大火烧开转小火炖 55 分钟。","出锅前加盐，撒葱花。"],"tips":"玉米选甜玉米，汤自带清甜，不用加任何提鲜调料。","id":"pork-25","source":"内置菜谱"},{"name":"萝卜排骨汤","category":"pork","kind":"汤","minutes":80,"difficulty":1,"spicy":0,"tags":["汤水","清淡","冬天"],"ingredients":[{"name":"肋排","amount":"500 克","group":"主料"},{"name":"白萝卜","amount":"500 克","group":"主料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"白胡椒粉","amount":"少许","group":"调料"},{"name":"枸杞","amount":"10 粒","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["排骨焯水洗净；白萝卜去皮切滚刀块。","排骨加姜片和热水，小火炖 40 分钟。","下萝卜再炖 25 分钟至透明。","加盐、白胡椒粉，撒枸杞和葱花。"],"tips":"白胡椒最后放，暖胃的辛香才留得住。","id":"pork-26","source":"内置菜谱"},{"name":"海带排骨汤","category":"pork","kind":"汤","minutes":90,"difficulty":1,"spicy":0,"tags":["汤水","补碘","清淡"],"ingredients":[{"name":"肋排","amount":"500 克","group":"主料"},{"name":"海带结","amount":"200 克","group":"主料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["海带结反复冲洗，冷水泡 20 分钟去咸味和沙。","排骨冷水下锅焯水，撇沫洗净。","排骨、姜片加热水，小火炖 50 分钟。","下海带结再炖 25 分钟，加盐调味。"],"tips":"海带先泡再炖，汤不发咸；用干海带自己泡发更香。","id":"pork-27","source":"内置菜谱"},{"name":"猪蹄汤","category":"pork","kind":"汤","minutes":150,"difficulty":2,"spicy":0,"tags":["汤水","胶原","滋补"],"ingredients":[{"name":"猪蹄","amount":"2 只","group":"主料"},{"name":"黄豆","amount":"80 克","group":"主料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"},{"name":"白胡椒粉","amount":"少许","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["黄豆提前泡 4 小时；猪蹄剁块，冷水下锅加料酒焯 5 分钟，拔净毛。","猪蹄、黄豆、姜片入砂锅，加足量热水。","大火烧开转小火炖 2 小时，汤色转奶白。","加盐和白胡椒粉，撒葱花。"],"tips":"想汤白就保持小火微沸、别频繁揭盖，胶质自然乳化。","id":"pork-28","source":"内置菜谱"},{"name":"猪肚排骨汤","category":"pork","kind":"汤","minutes":130,"difficulty":2,"spicy":1,"tags":["汤水","暖胃","潮汕"],"ingredients":[{"name":"猪肚","amount":"1 个","group":"主料"},{"name":"肋排","amount":"300 克","group":"主料"},{"name":"白胡椒粒","amount":"1 勺","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"面粉","amount":"2 勺","group":"调料"},{"name":"白醋","amount":"2 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["猪肚用面粉和白醋反复揉搓 3 遍，冲净黏液，翻面再洗一次。","猪肚冷水下锅焯 3 分钟，刮掉白膜，切条。","排骨焯水洗净。","猪肚、排骨、姜片、拍碎的白胡椒粒入锅，加热水炖 90 分钟。","加盐调味，胡椒香浓。"],"tips":"洗猪肚只靠面粉+醋，别用碱；白胡椒要拍碎才出味。","id":"pork-29","source":"内置菜谱"},{"name":"瘦肉丸子汤","category":"pork","kind":"汤","minutes":35,"difficulty":2,"spicy":0,"tags":["汤水","清淡","孩子爱吃"],"ingredients":[{"name":"猪肉末","amount":"300 克","group":"主料"},{"name":"鸡蛋","amount":"1 个","group":"主料"},{"name":"冬瓜","amount":"300 克","group":"主料"},{"name":"姜葱水","amount":"3 勺","group":"调料"},{"name":"淀粉","amount":"2 勺","group":"调料"},{"name":"白胡椒粉","amount":"少许","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["肉末加鸡蛋、姜葱水、淀粉、盐、白胡椒粉，顺一个方向搅 3 分钟至上劲。","冬瓜去皮切薄片。","锅中水烧到微沸（不要大滚），用虎口挤丸子下锅。","丸子浮起后撇沫，下冬瓜煮 5 分钟。","加盐、香油、葱花。"],"tips":"水微沸下丸子才不散；搅打上劲是弹牙的唯一办法。","id":"pork-30","source":"内置菜谱"},{"name":"糖醋里脊","category":"pork","kind":"荤","minutes":30,"difficulty":2,"spicy":0,"tags":["酸甜","孩子爱吃","宴客"],"ingredients":[{"name":"猪里脊","amount":"300 克","group":"主料"},{"name":"鸡蛋","amount":"1 个","group":"主料"},{"name":"淀粉","amount":"4 勺","group":"调料"},{"name":"面粉","amount":"2 勺","group":"调料"},{"name":"番茄酱","amount":"3 勺","group":"调料"},{"name":"白糖","amount":"2 勺","group":"调料"},{"name":"白醋","amount":"2 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"白芝麻","amount":"少许","group":"调料"}],"steps":["里脊切条，加盐、料酒腌 10 分钟。","鸡蛋、淀粉、面粉加少量水调成能挂住筷子的糊，肉条裹匀。","五成热油下锅炸至定型捞出，升温到七成复炸 30 秒至金黄酥脆。","锅留底油，下番茄酱、糖、醋、3 勺水，小火熬到冒泡浓稠。","倒入肉条快速翻匀，撒芝麻出锅。"],"tips":"复炸是脆的关键；糖醋汁熬到能挂勺再下肉，早了就稀。","id":"pork-31","source":"内置菜谱"},{"name":"锅包肉","category":"pork","kind":"荤","minutes":35,"difficulty":3,"spicy":0,"tags":["东北菜","酸甜","经典"],"ingredients":[{"name":"猪里脊","amount":"300 克","group":"主料"},{"name":"土豆淀粉","amount":"100 克","group":"主料"},{"name":"白糖","amount":"3 勺","group":"调料"},{"name":"白醋","amount":"3 勺","group":"调料"},{"name":"生抽","amount":"半勺","group":"调料"},{"name":"姜丝","amount":"1 勺","group":"调料"},{"name":"葱丝","amount":"1 勺","group":"调料"},{"name":"胡萝卜丝","amount":"1 勺","group":"调料"},{"name":"香菜","amount":"1 根","group":"调料"}],"steps":["里脊切 3 毫米厚的大片，加盐、料酒腌 10 分钟。","土豆淀粉加水泡 30 分钟，倒掉上层清水，用沉淀的湿淀粉抓匀肉片。","六成热油炸到定型捞出，升高油温复炸到金黄硬脆。","糖、醋、生抽、2 勺水调成汁；锅烧热倒汁，熬到冒大泡。","下葱姜丝、胡萝卜丝，倒肉片和香菜，10 秒内翻匀出锅。"],"tips":"必须用土豆淀粉的湿粉，白醋不能换成陈醋，否则颜色发黑。","id":"pork-32","source":"内置菜谱"},{"name":"炸酥肉","category":"pork","kind":"荤","minutes":40,"difficulty":2,"spicy":1,"tags":["小吃","下酒","重庆"],"ingredients":[{"name":"猪五花肉","amount":"300 克","group":"主料"},{"name":"红薯淀粉","amount":"80 克","group":"主料"},{"name":"鸡蛋","amount":"2 个","group":"主料"},{"name":"花椒粉","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"姜末","amount":"1 勺","group":"调料"}],"steps":["五花肉切筷子粗的条，加盐、花椒粉、料酒、姜末腌 20 分钟。","红薯淀粉加鸡蛋调成厚糊，能挂在肉上不滴落。","五成热油逐条下锅，炸 3 分钟至浅黄捞出。","油温升到七成，回锅复炸 40 秒至酥脆。"],"tips":"红薯淀粉比玉米淀粉更酥；复炸后放凉也不回软。","id":"pork-33","source":"内置菜谱"},{"name":"烤五花肉","category":"pork","kind":"荤","minutes":50,"difficulty":1,"spicy":2,"tags":["烧烤","下酒","生菜包"],"ingredients":[{"name":"带皮五花肉","amount":"400 克","group":"主料"},{"name":"生菜","amount":"1 颗","group":"主料"},{"name":"蒜片","amount":"适量","group":"主料"},{"name":"韩式辣酱","amount":"2 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"蜂蜜","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"孜然粉","amount":"1 勺","group":"调料"}],"steps":["五花肉切 5 毫米厚片，加所有调料抓匀，冷藏腌 30 分钟。","烤盘铺锡纸，肉片平铺不重叠。","烤箱 200 度预热，中层烤 15 分钟。","取出刷一层蜂蜜，再烤 5 分钟至边缘焦香。","配生菜、蒜片卷着吃。"],"tips":"想更脆就最后 3 分钟开热风；蜂蜜最后刷，早刷会焦黑。","id":"pork-34","source":"内置菜谱"},{"name":"香煎猪排","category":"pork","kind":"荤","minutes":25,"difficulty":1,"spicy":0,"tags":["快手","西式","高蛋白"],"ingredients":[{"name":"猪大排","amount":"2 块","group":"主料"},{"name":"黑胡椒","amount":"适量","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"蒜","amount":"3 瓣","group":"调料"},{"name":"黄油","amount":"10 克","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["猪排用刀背轻拍松，边缘筋膜剪两刀防卷。","两面撒盐、黑胡椒，抹料酒，腌 15 分钟。","平底锅烧热放油，大火下猪排煎 2 分钟，翻面再煎 2 分钟。","加蒜瓣和黄油，倾斜锅用勺把黄油浇在肉上 30 秒。","出锅静置 3 分钟再切。"],"tips":"静置这一步不能省，肉汁回流才不柴。","id":"pork-35","source":"内置菜谱"},{"name":"蜜汁叉烧","category":"pork","kind":"荤","minutes":60,"difficulty":2,"spicy":1,"tags":["粤菜","甜口","宴客"],"ingredients":[{"name":"梅花肉","amount":"500 克","group":"主料"},{"name":"叉烧酱","amount":"3 勺","group":"调料"},{"name":"蜂蜜","amount":"2 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"蚝油","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"红曲粉","amount":"少许","group":"调料"}],"steps":["梅花肉切长条，用叉子扎孔。","所有调料（留一半蜂蜜）抓匀，冷藏腌 4 小时以上，过夜最好。","烤箱 200 度，肉放烤网，下层接烤盘，烤 20 分钟。","翻面刷蜂蜜，再烤 10 分钟。","出炉刷一层蜂蜜，静置 10 分钟切片。"],"tips":"梅花肉肥瘦相间最适合；蜂蜜分两次刷，才有那层亮壳。","id":"pork-36","source":"内置菜谱"},{"name":"椒盐排骨","category":"pork","kind":"荤","minutes":45,"difficulty":2,"spicy":2,"tags":["下酒","香口","粤菜"],"ingredients":[{"name":"肋排","amount":"500 克","group":"主料"},{"name":"青红椒","amount":"各半个","group":"主料"},{"name":"椒盐","amount":"2 勺","group":"调料"},{"name":"蒜末","amount":"4 瓣","group":"调料"},{"name":"淀粉","amount":"3 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"五香粉","amount":"少许","group":"调料"}],"steps":["排骨斩小块，加生抽、料酒、五香粉、蒜末腌 30 分钟。","沥干水分，拍一层薄淀粉。","六成热油下排骨，中火炸 5 分钟捞出；升温复炸 1 分钟至外脆。","锅留底油，炒香蒜末、青红椒粒。","倒排骨，撒椒盐大火翻匀。"],"tips":"淀粉要薄，厚了就是面壳；椒盐最后撒，提前放会苦。","id":"pork-37","source":"内置菜谱"},{"name":"宫保鸡丁","category":"poultry","kind":"荤","minutes":20,"difficulty":2,"spicy":2,"tags":["川菜","经典","下饭"],"ingredients":[{"name":"鸡腿肉","amount":"300 克","group":"主料"},{"name":"熟花生米","amount":"60 克","group":"主料"},{"name":"干辣椒","amount":"8 个","group":"主料"},{"name":"大葱","amount":"1 根","group":"主料"},{"name":"花椒","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"香醋","amount":"1.5 勺","group":"调料"},{"name":"白糖","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["鸡腿去骨切 1.5 厘米丁，加盐、料酒、淀粉抓匀腌 15 分钟。","生抽、醋、糖、淀粉、3 勺水调成荔枝味汁；大葱切小段。","热锅下油，中火下干辣椒和花椒炒到辣椒变枣红，别炒黑。","下鸡丁大火炒到变白，加葱段炒 20 秒。","淋汁快速翻匀，最后倒花生米，翻两下出锅。"],"tips":"辣椒段要在油里\"炒香不炒糊\"，花生米最后放才脆。","id":"poultry-01","source":"内置菜谱"},{"name":"辣子鸡","category":"poultry","kind":"荤","minutes":35,"difficulty":2,"spicy":3,"tags":["川菜","重口","下酒"],"ingredients":[{"name":"鸡腿肉","amount":"500 克","group":"主料"},{"name":"干辣椒","amount":"60 克","group":"主料"},{"name":"花椒","amount":"2 勺","group":"主料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"蒜片","amount":"5 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"2 勺","group":"调料"},{"name":"白芝麻","amount":"少许","group":"调料"}],"steps":["鸡腿切小块，加盐、料酒、姜片、淀粉腌 20 分钟。","六成热油下鸡块炸 4 分钟至定型，升高油温复炸 1 分钟至外酥。","锅留少量油，小火下干辣椒、花椒炒出香味（辣椒变亮红色）。","下姜蒜片，倒鸡块，淋生抽。","大火翻炒 1 分钟让辣味裹上，撒白芝麻。"],"tips":"辣椒比鸡多才对；辣椒下锅油温要低，一糊整锅苦。","id":"poultry-02","source":"内置菜谱"},{"name":"黄焖鸡","category":"poultry","kind":"荤","minutes":40,"difficulty":1,"spicy":1,"tags":["家常","下饭","一人食"],"ingredients":[{"name":"鸡腿","amount":"2 个","group":"主料"},{"name":"香菇","amount":"6 朵","group":"主料"},{"name":"青椒","amount":"2 个","group":"主料"},{"name":"土豆","amount":"1 个","group":"主料"},{"name":"黄豆酱","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"冰糖","amount":"8 克","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["鸡腿剁块，冷水下锅焯 2 分钟捞出。","锅中少油下冰糖炒化，倒鸡块翻炒上色。","加姜片、黄豆酱炒香，淋生抽、老抽、料酒。","倒热水没过，放香菇和土豆，小火焖 20 分钟。","下青椒块，大火收汁到浓稠。"],"tips":"汤汁收到能挂勺再关火，拌饭才是这道菜的灵魂。","id":"poultry-03","source":"内置菜谱"},{"name":"香菇滑鸡","category":"poultry","kind":"荤","minutes":30,"difficulty":1,"spicy":0,"tags":["家常","清淡","下饭"],"ingredients":[{"name":"鸡腿肉","amount":"400 克","group":"主料"},{"name":"香菇","amount":"8 朵","group":"主料"},{"name":"姜丝","amount":"1 勺","group":"调料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"蚝油","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["鸡腿肉切块，加生抽、蚝油、淀粉、料酒、姜丝抓匀腌 20 分钟。","香菇切片，铺在盘底。","鸡肉铺在香菇上，撒蒜片。","上锅大火上汽后蒸 15 分钟。","出锅淋一勺热油，撒葱花。"],"tips":"香菇垫底吸鸡汁，鸡肉铺平别堆厚，蒸 15 分钟刚好滑嫩。","id":"poultry-04","source":"内置菜谱"},{"name":"土豆烧鸡块","category":"poultry","kind":"荤","minutes":45,"difficulty":1,"spicy":1,"tags":["家常","下饭","一锅出"],"ingredients":[{"name":"鸡腿","amount":"2 个","group":"主料"},{"name":"土豆","amount":"2 个","group":"主料"},{"name":"青椒","amount":"1 个","group":"主料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"冰糖","amount":"8 克","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"八角","amount":"1 个","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"}],"steps":["鸡腿剁块焯水，土豆切滚刀块，青椒切块。","少油炒冰糖，下鸡块翻炒上色。","加姜片、八角、生抽、老抽、料酒炒匀。","加热水没过鸡块，小火炖 15 分钟。","下土豆再炖 15 分钟，放青椒，大火收汁。"],"tips":"土豆切好泡水去淀粉，炖出来的汤才不浑。","id":"poultry-05","source":"内置菜谱"},{"name":"可乐鸡翅","category":"poultry","kind":"荤","minutes":30,"difficulty":1,"spicy":0,"tags":["快手","甜口","孩子爱吃"],"ingredients":[{"name":"鸡翅中","amount":"10 个","group":"主料"},{"name":"可乐","amount":"330 毫升","group":"主料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["鸡翅两面各划两刀，冷水下锅加姜片、料酒焯 3 分钟，捞出擦干。","锅中少油，鸡翅皮朝下煎到两面金黄。","加姜片、生抽、老抽翻匀。","倒可乐没过鸡翅，大火烧开转中火煮 12 分钟。","开大火收汁，收到黏亮裹住鸡翅。"],"tips":"可乐已经够甜，别加糖；收汁时勤翻，糖分极易糊锅。","id":"poultry-06","source":"内置菜谱"},{"name":"红烧鸡翅","category":"poultry","kind":"荤","minutes":30,"difficulty":1,"spicy":0,"tags":["家常","下饭"],"ingredients":[{"name":"鸡翅中","amount":"10 个","group":"主料"},{"name":"冰糖","amount":"15 克","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"八角","amount":"1 个","group":"调料"}],"steps":["鸡翅划刀，冷水焯水后擦干。","少油炒冰糖至微黄，下鸡翅煎炒上色。","加姜片、八角、料酒、生抽、老抽。","加热水至鸡翅一半，中小火焖 15 分钟。","大火收汁，撒葱花。"],"tips":"鸡翅先擦干再下锅，才能煎出金黄不溅油。","id":"poultry-07","source":"内置菜谱"},{"name":"清炖鸡汤","category":"poultry","kind":"汤","minutes":100,"difficulty":1,"spicy":0,"tags":["汤水","清淡","滋补"],"ingredients":[{"name":"土鸡","amount":"半只","group":"主料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"葱段","amount":"2 段","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"枸杞","amount":"15 粒","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["鸡剁块，冷水浸泡 30 分钟去血水。","冷水下锅，加姜片、料酒，水开后撇净浮沫，煮 2 分钟捞出用温水冲净。","鸡块、姜片、葱段入砂锅，加足量热水（一次加够）。","大火烧开转最小火炖 90 分钟，汤面只冒小泡。","出锅前 5 分钟放枸杞，只加盐。"],"tips":"小火慢炖汤才清；大火滚会把脂肪打散，汤浑且腥。","id":"poultry-08","source":"内置菜谱"},{"name":"冬瓜鸡汤","category":"poultry","kind":"汤","minutes":80,"difficulty":1,"spicy":0,"tags":["汤水","清淡","消暑"],"ingredients":[{"name":"鸡腿","amount":"2 个","group":"主料"},{"name":"冬瓜","amount":"500 克","group":"主料"},{"name":"姜片","amount":"3 片","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"白胡椒粉","amount":"少许","group":"调料"}],"steps":["鸡腿剁块焯水洗净；冬瓜去皮切厚片。","鸡块加姜片、热水，小火炖 50 分钟。","下冬瓜再炖 15 分钟至透明。","加盐、白胡椒粉，撒葱花。"],"tips":"冬瓜后放，15 分钟刚好软而不烂，早了会化在汤里。","id":"poultry-09","source":"内置菜谱"},{"name":"木耳炒鸡片","category":"poultry","kind":"荤","minutes":20,"difficulty":1,"spicy":1,"tags":["家常","快手"],"ingredients":[{"name":"鸡胸肉","amount":"250 克","group":"主料"},{"name":"泡发木耳","amount":"100 克","group":"主料"},{"name":"胡萝卜","amount":"半根","group":"主料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"蚝油","amount":"半勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"蛋清","amount":"半个","group":"调料"}],"steps":["鸡胸逆纹切薄片，加盐、蛋清、淀粉抓匀腌 15 分钟。","木耳焯水 1 分钟捞出。","热锅温油下鸡片滑散至变白，盛出。","蒜片爆香，下木耳、胡萝卜片炒 1 分钟，回鸡片淋蚝油翻匀。"],"tips":"鸡胸加蛋清和淀粉\"上浆\"，怎么炒都不柴。","id":"poultry-10","source":"内置菜谱"},{"name":"芹菜炒鸡丝","category":"poultry","kind":"荤","minutes":20,"difficulty":1,"spicy":1,"tags":["家常","低卡","快手"],"ingredients":[{"name":"鸡胸肉","amount":"250 克","group":"主料"},{"name":"芹菜","amount":"300 克","group":"主料"},{"name":"蒜末","amount":"2 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"蛋清","amount":"半个","group":"调料"}],"steps":["鸡胸顺纹切丝，加盐、蛋清、淀粉腌 15 分钟。","芹菜撕筋切段，焯水 30 秒过凉。","温油滑炒鸡丝至变白盛出。","蒜末爆香，下芹菜大火炒 1 分钟，回鸡丝调盐出锅。"],"tips":"鸡丝顺纹切才不断，芹菜焯过水才脆绿。","id":"poultry-11","source":"内置菜谱"},{"name":"青椒炒鸡丁","category":"poultry","kind":"荤","minutes":20,"difficulty":1,"spicy":1,"tags":["家常","快手","下饭"],"ingredients":[{"name":"鸡腿肉","amount":"300 克","group":"主料"},{"name":"青椒","amount":"3 个","group":"主料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"蚝油","amount":"半勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["鸡腿肉切 1.5 厘米丁，加生抽、料酒、淀粉腌 15 分钟。","青椒去籽切丁。","热油下鸡丁大火炒到表面金黄，盛出。","下蒜片、青椒丁炒 1 分钟，回鸡丁，淋蚝油翻匀。"],"tips":"鸡丁要大火煎出焦边再炒，比直接滑炒香得多。","id":"poultry-12","source":"内置菜谱"},{"name":"泡椒鸡杂","category":"poultry","kind":"荤","minutes":25,"difficulty":2,"spicy":3,"tags":["川菜","重口","下饭"],"ingredients":[{"name":"鸡胗","amount":"200 克","group":"主料"},{"name":"鸡心","amount":"100 克","group":"主料"},{"name":"泡椒","amount":"6 个","group":"主料"},{"name":"芹菜","amount":"100 克","group":"主料"},{"name":"泡姜","amount":"1 块","group":"调料"},{"name":"蒜片","amount":"4 瓣","group":"调料"},{"name":"豆瓣","amount":"半勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"}],"steps":["鸡胗切花刀再切块，鸡心对半切，用盐和淀粉抓洗两遍去腥。","加料酒、淀粉、少许生抽腌 10 分钟。","热油大火下鸡杂爆炒 1 分钟至变色卷曲，盛出。","下泡椒、泡姜、蒜片、豆瓣炒出红油。","倒鸡杂和芹菜段，淋生抽大火翻 30 秒。"],"tips":"鸡杂全程大火、时间要短，多炒 1 分钟就老得咬不动。","id":"poultry-13","source":"内置菜谱"},{"name":"酸辣鸡杂","category":"poultry","kind":"荤","minutes":25,"difficulty":2,"spicy":3,"tags":["川菜","开胃","下饭"],"ingredients":[{"name":"鸡胗","amount":"250 克","group":"主料"},{"name":"酸豆角","amount":"80 克","group":"主料"},{"name":"小米辣","amount":"4 个","group":"主料"},{"name":"蒜末","amount":"4 瓣","group":"调料"},{"name":"姜末","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"香醋","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"}],"steps":["鸡胗切片，用盐、淀粉抓洗，冲净后加料酒、淀粉腌 10 分钟。","酸豆角切小段，小米辣切圈。","大火热油，下鸡胗爆炒到卷曲变色，盛出。","下姜蒜、小米辣、酸豆角炒香。","回鸡胗，淋生抽和醋，大火翻匀出锅。"],"tips":"醋沿锅边淋，酸味才冲；酸豆角本身咸，盐要少放。","id":"poultry-14","source":"内置菜谱"},{"name":"香酥鸡排","category":"poultry","kind":"荤","minutes":30,"difficulty":1,"spicy":1,"tags":["小吃","孩子爱吃","下酒"],"ingredients":[{"name":"鸡胸肉","amount":"2 块","group":"主料"},{"name":"鸡蛋","amount":"1 个","group":"主料"},{"name":"面包糠","amount":"100 克","group":"主料"},{"name":"淀粉","amount":"50 克","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"黑胡椒","amount":"适量","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["鸡胸横刀片成两片，用刀背拍松，加盐、黑胡椒、料酒腌 15 分钟。","依次裹淀粉、蛋液、面包糠，用手压紧。","五成热油中火炸 4 分钟，两面金黄捞出。","升高油温复炸 30 秒，沥油切条。"],"tips":"面包糠压紧不脱落；油温别高，否则外焦里生。","id":"poultry-15","source":"内置菜谱"},{"name":"奥尔良烤翅","category":"poultry","kind":"荤","minutes":50,"difficulty":1,"spicy":1,"tags":["烧烤","孩子爱吃","快手"],"ingredients":[{"name":"鸡翅中","amount":"10 个","group":"主料"},{"name":"奥尔良腌料","amount":"3 勺","group":"调料"},{"name":"蜂蜜","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["鸡翅两面划刀，加腌料、料酒抓匀，冷藏腌 4 小时以上。","烤盘铺锡纸，鸡翅平铺。","烤箱 200 度烤 15 分钟。","翻面刷蜂蜜，再烤 8 分钟至表面焦亮。"],"tips":"腌够时间才入味；蜂蜜最后刷，早了会发黑。","id":"poultry-16","source":"内置菜谱"},{"name":"白切鸡","category":"poultry","kind":"荤","minutes":50,"difficulty":2,"spicy":0,"tags":["粤菜","清淡","宴客"],"ingredients":[{"name":"三黄鸡","amount":"半只","group":"主料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"葱段","amount":"3 段","group":"调料"},{"name":"姜末","amount":"2 勺","group":"调料"},{"name":"葱花","amount":"2 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"花生油","amount":"2 勺","group":"调料"}],"steps":["锅中水烧开，放姜片、葱段，提着鸡腿把鸡浸入水中 10 秒再提起，重复 3 次让鸡皮收紧。","整鸡放入，水保持微沸（约 90 度，不能大滚），浸煮 20 分钟。","捞出立刻泡冰水 10 分钟，鸡皮变脆爽。","姜末、葱花加盐，淋烧到冒烟的热花生油，调成姜葱蓉。","鸡斩件摆盘，配姜葱蓉。"],"tips":"全程水面\"虾眼水\"微沸，一滚皮就破；冰水激过才皮爽肉滑。","id":"poultry-17","source":"内置菜谱"},{"name":"口水鸡","category":"poultry","kind":"荤","minutes":40,"difficulty":2,"spicy":3,"tags":["川菜","凉菜","开胃"],"ingredients":[{"name":"鸡腿","amount":"2 个","group":"主料"},{"name":"熟花生碎","amount":"2 勺","group":"主料"},{"name":"姜片","amount":"3 片","group":"调料"},{"name":"花椒","amount":"1 勺","group":"调料"},{"name":"辣椒油","amount":"3 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"香醋","amount":"1 勺","group":"调料"},{"name":"白糖","amount":"1 勺","group":"调料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"花椒粉","amount":"半勺","group":"调料"},{"name":"白芝麻","amount":"1 勺","group":"调料"}],"steps":["鸡腿冷水下锅，加姜片、花椒，水开后煮 12 分钟，关火焖 5 分钟。","捞出泡冰水 10 分钟，捞出沥干斩件。","辣椒油、生抽、醋、糖、蒜末、花椒粉、2 勺煮鸡汤调成料汁。","料汁浇在鸡上，撒花生碎、白芝麻、葱花。"],"tips":"煮鸡的汤别倒，两勺鸡汤能让料汁有厚度、不寡。","id":"poultry-18","source":"内置菜谱"},{"name":"盐焗鸡","category":"poultry","kind":"荤","minutes":60,"difficulty":2,"spicy":0,"tags":["粤菜","咸香","宴客"],"ingredients":[{"name":"三黄鸡","amount":"半只","group":"主料"},{"name":"盐焗粉","amount":"1 包","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"葱段","amount":"4 段","group":"调料"},{"name":"花生油","amount":"1 勺","group":"调料"}],"steps":["鸡洗净擦干，里外抹匀盐焗粉，腌 30 分钟。","鸡腹塞姜片和葱段，表面刷一层花生油。","用油纸或锡纸包两层，放入锅中。","烤箱 200 度烤 40 分钟，或蒸锅大火蒸 30 分钟。","取出稍凉斩件，淋一点原汁。"],"tips":"鸡必须擦干再抹粉，水多会咸淡不匀；包两层纸锁住香气。","id":"poultry-19","source":"内置菜谱"},{"name":"豉油鸡","category":"poultry","kind":"荤","minutes":45,"difficulty":2,"spicy":0,"tags":["粤菜","咸甜","下饭"],"ingredients":[{"name":"三黄鸡","amount":"半只","group":"主料"},{"name":"生抽","amount":"150 毫升","group":"调料"},{"name":"老抽","amount":"1 勺","group":"调料"},{"name":"冰糖","amount":"30 克","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"葱段","amount":"3 段","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"桂皮","amount":"1 块","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"}],"steps":["生抽、老抽、冰糖、香料、姜葱和 400 毫升水煮开，尝一下咸甜。","鸡放入，皮朝下，小火煮 10 分钟。","翻面再煮 10 分钟，中途用勺把汁反复浇在鸡身上。","关火盖盖焖 10 分钟。","捞出稍凉斩件，淋一勺卤汁。"],"tips":"卤汁要偏甜一点，收浓后咸度会上升；反复浇汁上色才均匀。","id":"poultry-20","source":"内置菜谱"},{"name":"三杯鸡","category":"poultry","kind":"荤","minutes":40,"difficulty":2,"spicy":1,"tags":["台湾菜","香浓","下饭"],"ingredients":[{"name":"鸡腿","amount":"3 个","group":"主料"},{"name":"九层塔","amount":"1 把","group":"主料"},{"name":"麻油","amount":"3 勺","group":"调料"},{"name":"生抽","amount":"3 勺","group":"调料"},{"name":"米酒","amount":"3 勺","group":"调料"},{"name":"冰糖","amount":"15 克","group":"调料"},{"name":"蒜","amount":"8 瓣","group":"调料"},{"name":"姜片","amount":"6 片","group":"调料"},{"name":"干辣椒","amount":"3 个","group":"调料"}],"steps":["鸡腿剁块，冷水焯 2 分钟捞出擦干。","冷锅下麻油，小火煸姜片至卷边，再下蒜瓣炒香。","放鸡块，中火煎到表面金黄。","加生抽、米酒、冰糖、干辣椒，盖盖中小火焖 15 分钟。","开盖大火收汁，关火放九层塔，盖 30 秒焖出香气。"],"tips":"麻油不能大火，会苦；九层塔必须关火后放，靠余温激香。","id":"poultry-21","source":"内置菜谱"},{"name":"大盘鸡","category":"poultry","kind":"荤","minutes":60,"difficulty":2,"spicy":2,"tags":["新疆菜","一锅出","宴客"],"ingredients":[{"name":"鸡腿","amount":"4 个","group":"主料"},{"name":"土豆","amount":"2 个","group":"主料"},{"name":"青椒","amount":"2 个","group":"主料"},{"name":"皮带面","amount":"300 克","group":"主料"},{"name":"豆瓣","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"冰糖","amount":"10 克","group":"调料"},{"name":"啤酒","amount":"300 毫升","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"花椒","amount":"1 勺","group":"调料"}],"steps":["鸡腿剁块焯水；土豆切滚刀块，青椒切块。","热油下冰糖炒色，倒鸡块翻炒上色。","加姜片、八角、花椒、豆瓣炒香，淋生抽、老抽。","倒啤酒没过鸡块，小火炖 20 分钟。","下土豆再炖 15 分钟，放青椒收汁。","皮带面煮熟铺盘底，浇上鸡块和汤汁。"],"tips":"汤汁要多留一点拌面，收太干就白瞎了那口面。","id":"poultry-22","source":"内置菜谱"},{"name":"板栗烧鸡","category":"poultry","kind":"荤","minutes":60,"difficulty":2,"spicy":1,"tags":["家常","秋天","下饭"],"ingredients":[{"name":"鸡腿","amount":"3 个","group":"主料"},{"name":"板栗","amount":"300 克","group":"主料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"冰糖","amount":"10 克","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"八角","amount":"1 个","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"}],"steps":["板栗用刀划口，煮 5 分钟后趁热剥壳。","鸡腿剁块焯水，擦干。","少油炒冰糖，下鸡块翻炒上色，加姜片、八角炒香。","淋料酒、生抽、老抽，加热水没过，小火炖 20 分钟。","下板栗再炖 15 分钟，大火收汁。"],"tips":"板栗先煮再剥不伤手；炖到最后再收汁，板栗才不散。","id":"poultry-23","source":"内置菜谱"},{"name":"腐竹焖鸡","category":"poultry","kind":"荤","minutes":45,"difficulty":1,"spicy":1,"tags":["家常","下饭"],"ingredients":[{"name":"鸡腿","amount":"2 个","group":"主料"},{"name":"腐竹","amount":"100 克","group":"主料"},{"name":"香菇","amount":"4 朵","group":"主料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"蚝油","amount":"1 勺","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"蒜","amount":"4 瓣","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["腐竹提前用温水泡 40 分钟至软，切段。","鸡腿剁块焯水。","热油炒香姜蒜，下鸡块煎到微黄。","加生抽、蚝油、料酒，倒热水没过，放香菇炖 15 分钟。","下腐竹再炖 10 分钟，收汁。"],"tips":"腐竹用温水泡、别用开水，开水会把外层泡烂里面还硬。","id":"poultry-24","source":"内置菜谱"},{"name":"金针菇鸡汤","category":"poultry","kind":"汤","minutes":60,"difficulty":1,"spicy":0,"tags":["汤水","清淡","快手"],"ingredients":[{"name":"鸡腿","amount":"2 个","group":"主料"},{"name":"金针菇","amount":"200 克","group":"主料"},{"name":"姜片","amount":"3 片","group":"调料"},{"name":"枸杞","amount":"10 粒","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["鸡腿剁块焯水洗净。","鸡块加姜片、热水，小火炖 40 分钟。","金针菇去根撕散，下锅煮 5 分钟。","加盐、枸杞，撒葱花。"],"tips":"金针菇只要 5 分钟，久煮会失去脆感、汤发酸。","id":"poultry-25","source":"内置菜谱"},{"name":"虫草花鸡汤","category":"poultry","kind":"汤","minutes":90,"difficulty":1,"spicy":0,"tags":["汤水","滋补","宴客"],"ingredients":[{"name":"土鸡","amount":"半只","group":"主料"},{"name":"虫草花","amount":"30 克","group":"主料"},{"name":"红枣","amount":"6 颗","group":"主料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"枸杞","amount":"10 粒","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["虫草花用温水泡 10 分钟，冲洗两遍；红枣去核。","鸡剁块冷水焯水，撇沫洗净。","鸡块、姜片、红枣加热水，小火炖 60 分钟。","下虫草花再炖 20 分钟，加枸杞和盐。"],"tips":"虫草花泡的水有土味，倒掉不用；汤色金黄靠它，别放老抽。","id":"poultry-26","source":"内置菜谱"},{"name":"手撕鸡","category":"poultry","kind":"荤","minutes":35,"difficulty":1,"spicy":2,"tags":["凉菜","开胃","低卡"],"ingredients":[{"name":"鸡胸肉","amount":"300 克","group":"主料"},{"name":"黄瓜","amount":"1 根","group":"主料"},{"name":"姜片","amount":"3 片","group":"调料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"辣椒油","amount":"2 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"香醋","amount":"1 勺","group":"调料"},{"name":"白糖","amount":"半勺","group":"调料"},{"name":"白芝麻","amount":"1 勺","group":"调料"},{"name":"香菜","amount":"2 根","group":"调料"}],"steps":["鸡胸冷水下锅，加姜片，水开后煮 10 分钟，关火焖 5 分钟。","捞出稍凉，顺纹用手撕成条。","黄瓜拍碎垫底。","蒜末、辣椒油、生抽、醋、糖、2 勺煮鸡汤调成料汁。","浇在鸡丝上，撒芝麻和香菜。"],"tips":"手撕比刀切更挂汁；鸡肉别煮过头，筷子能扎透就关火。","id":"poultry-27","source":"内置菜谱"},{"name":"酱爆鸡丁","category":"poultry","kind":"荤","minutes":20,"difficulty":1,"spicy":1,"tags":["京菜","下饭","快手"],"ingredients":[{"name":"鸡腿肉","amount":"300 克","group":"主料"},{"name":"黄瓜","amount":"1 根","group":"主料"},{"name":"甜面酱","amount":"2 勺","group":"调料"},{"name":"生抽","amount":"半勺","group":"调料"},{"name":"白糖","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"蒜末","amount":"2 瓣","group":"调料"}],"steps":["鸡腿肉切丁，加料酒、淀粉腌 15 分钟；黄瓜切丁。","甜面酱、生抽、糖、2 勺水调匀。","热油下鸡丁炒到表面金黄，盛出。","小火炒香蒜末和酱汁，炒到冒泡。","倒鸡丁和黄瓜丁，翻匀裹酱出锅。"],"tips":"酱要炒到起泡才没有生酱味，黄瓜最后放保持脆。","id":"poultry-28","source":"内置菜谱"},{"name":"北京烤鸭","category":"poultry","kind":"荤","minutes":150,"difficulty":3,"spicy":0,"tags":["京菜","宴客","经典"],"ingredients":[{"name":"鸭","amount":"1 只","group":"主料"},{"name":"荷叶饼","amount":"20 张","group":"主料"},{"name":"黄瓜","amount":"1 根","group":"主料"},{"name":"大葱","amount":"2 根","group":"主料"},{"name":"麦芽糖","amount":"2 勺","group":"调料"},{"name":"白醋","amount":"2 勺","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"},{"name":"甜面酱","amount":"4 勺","group":"调料"}],"steps":["鸭洗净擦干，从脖子处充气让皮肉分离（可用吸管吹），用开水浇遍全身让皮收紧。","麦芽糖、白醋、料酒加温水调成脆皮水，刷遍鸭身。","挂起用风扇吹 4 小时以上，表皮完全干爽。","烤箱 200 度，鸭胸朝上烤 40 分钟，翻面再烤 20 分钟，最后 220 度上色 10 分钟。","片成薄片，配荷叶饼、葱丝、黄瓜条和甜面酱。"],"tips":"皮干是脆的唯一前提，吹不够时间烤出来就是软的。","id":"poultry-29","source":"内置菜谱"},{"name":"啤酒鸭","category":"poultry","kind":"荤","minutes":60,"difficulty":2,"spicy":2,"tags":["家常","下饭","香浓"],"ingredients":[{"name":"鸭腿","amount":"2 个","group":"主料"},{"name":"啤酒","amount":"500 毫升","group":"主料"},{"name":"青椒","amount":"2 个","group":"主料"},{"name":"豆瓣","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"冰糖","amount":"10 克","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"干辣椒","amount":"5 个","group":"调料"}],"steps":["鸭腿剁块，冷水下锅焯 3 分钟，捞出擦干。","干锅下鸭块，中火煸出鸭油至表面金黄。","加姜片、八角、干辣椒、豆瓣炒香，淋生抽、老抽。","倒啤酒没过鸭块，加冰糖，小火焖 35 分钟。","下青椒块，大火收汁。"],"tips":"鸭肉先干煸出油才不腥；啤酒要一次倒够，中途加水会寡。","id":"poultry-30","source":"内置菜谱"},{"name":"红烧鸭块","category":"poultry","kind":"荤","minutes":55,"difficulty":2,"spicy":1,"tags":["家常","下饭"],"ingredients":[{"name":"鸭腿","amount":"3 个","group":"主料"},{"name":"冰糖","amount":"15 克","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"桂皮","amount":"1 块","group":"调料"}],"steps":["鸭腿剁块，冷水下锅加姜片、料酒焯 3 分钟。","干锅煸炒鸭块至出油、表面微黄。","加冰糖炒化上色，下香料炒香，淋生抽、老抽。","加热水没过，小火炖 35 分钟。","大火收汁至浓稠。"],"tips":"鸭油多，全程不用额外加油，煸出的油可以倒掉一部分。","id":"poultry-31","source":"内置菜谱"},{"name":"姜母鸭","category":"poultry","kind":"荤","minutes":90,"difficulty":2,"spicy":1,"tags":["闽南菜","暖身","冬天"],"ingredients":[{"name":"鸭","amount":"半只","group":"主料"},{"name":"老姜","amount":"100 克","group":"主料"},{"name":"麻油","amount":"4 勺","group":"调料"},{"name":"米酒","amount":"300 毫升","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"冰糖","amount":"10 克","group":"调料"},{"name":"当归","amount":"2 片","group":"调料"}],"steps":["老姜切厚片，麻油小火煸到姜片卷边、香味浓。","下鸭块（剁块焯过水）翻炒到表面金黄。","淋生抽、米酒，加冰糖和当归。","倒热水至没过一半，小火焖 50 分钟。","收汁至汤浓，趁热吃。"],"tips":"姜要够多、煸到干香，这道菜的暖意全在姜上。","id":"poultry-32","source":"内置菜谱"},{"name":"卤鸭翅","category":"poultry","kind":"荤","minutes":60,"difficulty":1,"spicy":1,"tags":["卤味","下酒","追剧"],"ingredients":[{"name":"鸭翅","amount":"500 克","group":"主料"},{"name":"生抽","amount":"4 勺","group":"调料"},{"name":"老抽","amount":"1 勺","group":"调料"},{"name":"冰糖","amount":"20 克","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"桂皮","amount":"1 块","group":"调料"},{"name":"香叶","amount":"3 片","group":"调料"},{"name":"干辣椒","amount":"5 个","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"}],"steps":["鸭翅冷水下锅焯 3 分钟，洗净。","所有调料加 800 毫升水煮开，尝味调咸甜。","下鸭翅，小火卤 25 分钟。","关火浸泡 30 分钟以上，越泡越入味。"],"tips":"卤味靠泡不靠煮，煮久了皮烂骨散。","id":"poultry-33","source":"内置菜谱"},{"name":"卤鸭掌","category":"poultry","kind":"荤","minutes":70,"difficulty":1,"spicy":1,"tags":["卤味","下酒","追剧"],"ingredients":[{"name":"鸭掌","amount":"500 克","group":"主料"},{"name":"生抽","amount":"4 勺","group":"调料"},{"name":"老抽","amount":"1 勺","group":"调料"},{"name":"冰糖","amount":"20 克","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"桂皮","amount":"1 块","group":"调料"},{"name":"香叶","amount":"3 片","group":"调料"},{"name":"干辣椒","amount":"4 个","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"}],"steps":["鸭掌剪去指甲，冷水下锅焯 3 分钟。","卤水（所有调料加 800 毫升水）煮开。","下鸭掌小火卤 30 分钟。","关火泡 1 小时，捞出。"],"tips":"鸭掌胶质厚，泡一夜冷藏口感更弹，像果冻。","id":"poultry-34","source":"内置菜谱"},{"name":"鸭血粉丝汤","category":"poultry","kind":"汤","minutes":35,"difficulty":2,"spicy":1,"tags":["南京","汤水","小吃"],"ingredients":[{"name":"鸭血","amount":"300 克","group":"主料"},{"name":"粉丝","amount":"1 把","group":"主料"},{"name":"油豆腐","amount":"6 个","group":"主料"},{"name":"鸭胗","amount":"2 个","group":"主料"},{"name":"姜片","amount":"3 片","group":"调料"},{"name":"白胡椒粉","amount":"半勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"香菜","amount":"2 根","group":"调料"},{"name":"香醋","amount":"1 勺","group":"调料"},{"name":"辣椒油","amount":"1 勺","group":"调料"}],"steps":["鸭血切块，冷水下锅焯 2 分钟去腥。","鸭胗煮熟切片；粉丝温水泡软。","锅中加高汤或清水、姜片烧开，下鸭血、油豆腐煮 5 分钟。","下粉丝和鸭胗煮 2 分钟，加盐、白胡椒粉。","盛碗，淋醋和辣椒油，撒香菜。"],"tips":"鸭血先焯水，汤才不腥不浑；白胡椒是这碗汤的底味。","id":"poultry-35","source":"内置菜谱"},{"name":"酸萝卜老鸭汤","category":"poultry","kind":"汤","minutes":130,"difficulty":2,"spicy":1,"tags":["川菜","汤水","开胃"],"ingredients":[{"name":"老鸭","amount":"半只","group":"主料"},{"name":"酸萝卜","amount":"300 克","group":"主料"},{"name":"泡姜","amount":"1 块","group":"主料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"白胡椒粉","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["老鸭剁块，冷水下锅加料酒焯 5 分钟，撇沫洗净。","酸萝卜切厚片，泡姜切片。","鸭块、姜片、酸萝卜、泡姜入砂锅，加足热水。","大火烧开转小火炖 2 小时。","加盐和白胡椒粉，撒葱花。"],"tips":"酸萝卜本身有咸酸味，盐要最后尝过再加。","id":"poultry-36","source":"内置菜谱"},{"name":"魔芋烧鸭","category":"poultry","kind":"荤","minutes":60,"difficulty":2,"spicy":2,"tags":["川菜","低卡","下饭"],"ingredients":[{"name":"鸭腿","amount":"2 个","group":"主料"},{"name":"魔芋","amount":"400 克","group":"主料"},{"name":"青蒜","amount":"100 克","group":"主料"},{"name":"豆瓣","amount":"1.5 勺","group":"调料"},{"name":"花椒","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"},{"name":"冰糖","amount":"5 克","group":"调料"}],"steps":["魔芋切条，沸水焯 3 分钟去碱味。","鸭腿剁块，冷水焯水后干煸出油。","加姜片、花椒、豆瓣炒出红油，淋料酒、生抽。","加热水没过，小火焖 30 分钟。","下魔芋再焖 10 分钟，放青蒜段，大火收汁。"],"tips":"魔芋必须焯水，否则一股碱味毁整锅。","id":"poultry-37","source":"内置菜谱"},{"name":"土豆烧牛肉","category":"beef","kind":"荤","minutes":90,"difficulty":2,"spicy":1,"tags":["家常","下饭","一锅出"],"ingredients":[{"name":"牛腩","amount":"600 克","group":"主料"},{"name":"土豆","amount":"3 个","group":"主料"},{"name":"胡萝卜","amount":"1 根","group":"主料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"冰糖","amount":"10 克","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"桂皮","amount":"1 块","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"}],"steps":["牛腩切块，冷水浸泡 30 分钟，冷水下锅焯 3 分钟洗净。","热油下姜片、八角、桂皮炒香，倒牛肉煸炒至微干。","淋料酒、生抽、老抽，加冰糖炒匀。","加热水没过，小火炖 60 分钟至牛肉用筷子可插入。","下土豆、胡萝卜块再炖 20 分钟，大火收汁。"],"tips":"牛肉先煸干水分再炖才香；土豆后放，避免炖成泥。","id":"beef-01","source":"内置菜谱"},{"name":"青椒牛肉丝","category":"beef","kind":"荤","minutes":20,"difficulty":2,"spicy":1,"tags":["快手","下饭"],"ingredients":[{"name":"牛里脊","amount":"250 克","group":"主料"},{"name":"青椒","amount":"3 个","group":"主料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"蚝油","amount":"半勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"小苏打","amount":"一点点","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["牛里脊逆纹切细丝，加生抽、料酒、淀粉、一点小苏打抓匀，封油腌 15 分钟。","青椒去籽切丝。","锅烧到很热，下油，牛肉丝大火快炒 40 秒变色盛出。","下蒜片、青椒丝炒 1 分钟，回牛肉丝，淋蚝油翻匀。"],"tips":"牛肉逆纹切、大火快炒，这两条做到就不会老。","id":"beef-02","source":"内置菜谱"},{"name":"芹菜牛肉丝","category":"beef","kind":"荤","minutes":20,"difficulty":2,"spicy":1,"tags":["家常","下饭"],"ingredients":[{"name":"牛里脊","amount":"250 克","group":"主料"},{"name":"芹菜","amount":"300 克","group":"主料"},{"name":"蒜末","amount":"2 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"干辣椒","amount":"2 个","group":"调料"}],"steps":["牛肉逆纹切丝，加生抽、淀粉、少许油腌 15 分钟。","芹菜撕筋切段，焯水 30 秒。","大火热油，牛肉丝炒 40 秒盛出。","下蒜末、干辣椒、芹菜炒 1 分钟，回牛肉，调盐出锅。"],"tips":"芹菜焯过水再炒，牛肉就不用等它熟，嫩度保住了。","id":"beef-03","source":"内置菜谱"},{"name":"韭黄炒牛肉","category":"beef","kind":"荤","minutes":20,"difficulty":2,"spicy":1,"tags":["快手","下饭"],"ingredients":[{"name":"牛里脊","amount":"250 克","group":"主料"},{"name":"韭黄","amount":"250 克","group":"主料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"蒜末","amount":"2 瓣","group":"调料"}],"steps":["牛肉逆纹切片，加生抽、淀粉、少许油腌 15 分钟。","韭黄切段，根叶分开。","大火热油，牛肉片炒 40 秒盛出。","下蒜末、韭黄根部炒 20 秒，加叶子，回牛肉，调盐翻匀即出。"],"tips":"韭黄下锅不超过 40 秒，久了就塌成一摊。","id":"beef-04","source":"内置菜谱"},{"name":"木耳炒牛肉","category":"beef","kind":"荤","minutes":20,"difficulty":2,"spicy":1,"tags":["家常","补铁"],"ingredients":[{"name":"牛里脊","amount":"250 克","group":"主料"},{"name":"泡发木耳","amount":"100 克","group":"主料"},{"name":"青椒","amount":"1 个","group":"主料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"蚝油","amount":"半勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"}],"steps":["木耳焯水 1 分钟；牛肉逆纹切片，加生抽、淀粉腌 15 分钟。","大火热油，牛肉片炒 40 秒盛出。","蒜片爆香，下木耳、青椒炒 1 分钟。","回牛肉，淋蚝油，大火翻匀。"],"tips":"牛肉和木耳都要脆嫩，全程大火，别超过 2 分钟。","id":"beef-05","source":"内置菜谱"},{"name":"洋葱炒牛肉","category":"beef","kind":"荤","minutes":20,"difficulty":1,"spicy":1,"tags":["家常","下饭"],"ingredients":[{"name":"牛里脊","amount":"250 克","group":"主料"},{"name":"洋葱","amount":"1 个","group":"主料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"蚝油","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"黑胡椒","amount":"适量","group":"调料"}],"steps":["牛肉逆纹切片，加生抽、淀粉、黑胡椒腌 15 分钟。","洋葱切粗丝，用手掰散。","大火热油，牛肉炒 40 秒盛出。","下洋葱炒到边缘透明，回牛肉，淋蚝油翻匀。"],"tips":"洋葱炒到半透明最甜，炒太久会软塌出水。","id":"beef-06","source":"内置菜谱"},{"name":"杭椒牛柳","category":"beef","kind":"荤","minutes":25,"difficulty":2,"spicy":2,"tags":["下饭","湘菜"],"ingredients":[{"name":"牛里脊","amount":"300 克","group":"主料"},{"name":"杭椒","amount":"200 克","group":"主料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"蚝油","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"黑胡椒","amount":"适量","group":"调料"}],"steps":["牛里脊切筷子粗的条，加生抽、蚝油、淀粉、黑胡椒腌 20 分钟。","杭椒斜切段，干锅煸到起虎皮盛出。","大火热油，牛柳快速炒 1 分钟至变色。","下蒜片、杭椒，淋少许蚝油翻匀。"],"tips":"牛柳比片厚，腌的时候加点油封住，炒出来才不干。","id":"beef-07","source":"内置菜谱"},{"name":"黑椒牛柳","category":"beef","kind":"荤","minutes":25,"difficulty":2,"spicy":1,"tags":["西式","下饭","快手"],"ingredients":[{"name":"牛里脊","amount":"300 克","group":"主料"},{"name":"洋葱","amount":"半个","group":"主料"},{"name":"彩椒","amount":"1 个","group":"主料"},{"name":"黑胡椒碎","amount":"1 勺","group":"调料"},{"name":"蚝油","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"黄油","amount":"10 克","group":"调料"}],"steps":["牛里脊切条，加生抽、淀粉、半勺黑胡椒腌 20 分钟。","洋葱、彩椒切条。","大火热油，牛柳炒 1 分钟盛出。","下黄油、洋葱炒香，加彩椒和剩余黑胡椒。","回牛柳，淋蚝油，大火翻匀。"],"tips":"黑胡椒分两次放：腌时入味，起锅前补香。","id":"beef-08","source":"内置菜谱"},{"name":"孜然牛肉","category":"beef","kind":"荤","minutes":25,"difficulty":2,"spicy":2,"tags":["烧烤味","下酒","下饭"],"ingredients":[{"name":"牛里脊","amount":"300 克","group":"主料"},{"name":"洋葱","amount":"半个","group":"主料"},{"name":"香菜","amount":"2 根","group":"主料"},{"name":"孜然粒","amount":"1 勺","group":"调料"},{"name":"辣椒粉","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"白芝麻","amount":"1 勺","group":"调料"}],"steps":["牛肉逆纹切片，加生抽、淀粉腌 15 分钟。","孜然粒干锅小火焙香，盛出。","大火热油，牛肉炒到边缘焦黄。","下洋葱丝炒软，撒孜然、辣椒粉、盐。","关火放香菜段和白芝麻，翻匀。"],"tips":"孜然要焙过再撒，香味才出得来；香菜关火后放。","id":"beef-09","source":"内置菜谱"},{"name":"小炒黄牛肉","category":"beef","kind":"荤","minutes":20,"difficulty":2,"spicy":3,"tags":["湘菜","重口","下饭"],"ingredients":[{"name":"黄牛肉","amount":"300 克","group":"主料"},{"name":"小米辣","amount":"6 个","group":"主料"},{"name":"芹菜","amount":"100 克","group":"主料"},{"name":"蒜末","amount":"4 瓣","group":"调料"},{"name":"姜末","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"蚝油","amount":"半勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["牛肉逆纹切薄片，加生抽、料酒、淀粉抓匀腌 15 分钟。","小米辣切圈，芹菜切段。","锅烧到冒烟，多放点油，牛肉下锅大火爆炒 40 秒盛出。","下姜蒜、小米辣炒香，加芹菜炒 30 秒。","回牛肉，淋蚝油，大火翻匀。"],"tips":"这道菜讲究\"锅气\"，锅不够热就出不了那个香。","id":"beef-10","source":"内置菜谱"},{"name":"泡椒牛肉丝","category":"beef","kind":"荤","minutes":20,"difficulty":2,"spicy":2,"tags":["川菜","下饭"],"ingredients":[{"name":"牛里脊","amount":"250 克","group":"主料"},{"name":"泡椒","amount":"6 个","group":"主料"},{"name":"芹菜","amount":"100 克","group":"主料"},{"name":"泡姜","amount":"1 块","group":"调料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["牛肉逆纹切丝，加料酒、淀粉腌 15 分钟。","泡椒、泡姜切丝，芹菜切段。","大火热油，牛肉丝炒 40 秒盛出。","下泡椒、泡姜、蒜片炒出香味。","回牛肉和芹菜，淋生抽翻匀。"],"tips":"泡椒的酸辣是主角，别再加醋和糖抢味。","id":"beef-11","source":"内置菜谱"},{"name":"蒜苔炒牛肉","category":"beef","kind":"荤","minutes":20,"difficulty":2,"spicy":1,"tags":["家常","下饭"],"ingredients":[{"name":"牛里脊","amount":"250 克","group":"主料"},{"name":"蒜苔","amount":"300 克","group":"主料"},{"name":"蒜片","amount":"2 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"蚝油","amount":"半勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"}],"steps":["蒜苔焯水 40 秒；牛肉逆纹切丝，加生抽、淀粉腌 15 分钟。","大火热油，牛肉炒 40 秒盛出。","下蒜片、蒜苔炒 1 分钟。","回牛肉，淋蚝油，调盐翻匀。"],"tips":"蒜苔先焯水，才能和牛肉同时到位。","id":"beef-12","source":"内置菜谱"},{"name":"红烧牛肉","category":"beef","kind":"荤","minutes":100,"difficulty":2,"spicy":1,"tags":["经典","下饭","面浇头"],"ingredients":[{"name":"牛腩","amount":"700 克","group":"主料"},{"name":"冰糖","amount":"20 克","group":"调料"},{"name":"生抽","amount":"3 勺","group":"调料"},{"name":"老抽","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"3 勺","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"桂皮","amount":"1 块","group":"调料"},{"name":"香叶","amount":"3 片","group":"调料"},{"name":"干辣椒","amount":"3 个","group":"调料"}],"steps":["牛腩切块，冷水泡 30 分钟去血水，冷水下锅焯 5 分钟。","少油炒冰糖至枣红，下牛肉翻炒上色。","加香料、姜片炒香，淋料酒、生抽、老抽。","加热水没过，小火炖 80 分钟至软烂。","大火收汁，留一点汤拌面。"],"tips":"牛肉别用大火久煮，小火炖才烂而不柴；汤汁留着煮面一流。","id":"beef-13","source":"内置菜谱"},{"name":"番茄炖牛肉","category":"beef","kind":"荤","minutes":100,"difficulty":1,"spicy":0,"tags":["家常","酸甜","下饭"],"ingredients":[{"name":"牛腩","amount":"600 克","group":"主料"},{"name":"番茄","amount":"4 个","group":"主料"},{"name":"洋葱","amount":"1 个","group":"主料"},{"name":"番茄酱","amount":"2 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"冰糖","amount":"10 克","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"}],"steps":["牛腩切块焯水洗净；番茄两个切块、两个打成泥。","热油炒洋葱至透明，下番茄块炒出沙。","加番茄泥和番茄酱炒 2 分钟。","倒牛肉，淋料酒、生抽，加冰糖和热水没过。","小火炖 80 分钟，收汁到浓稠。"],"tips":"番茄分两次用：块状吃口感，泥状出浓汤。","id":"beef-14","source":"内置菜谱"},{"name":"萝卜炖牛肉","category":"beef","kind":"荤","minutes":100,"difficulty":1,"spicy":1,"tags":["家常","汤菜","冬天"],"ingredients":[{"name":"牛腩","amount":"600 克","group":"主料"},{"name":"白萝卜","amount":"600 克","group":"主料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"八角","amount":"1 个","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"},{"name":"白胡椒粉","amount":"少许","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["牛腩切块焯水；白萝卜切滚刀块。","牛肉加姜片、八角、料酒和热水，小火炖 70 分钟。","下萝卜再炖 25 分钟至透明。","加生抽、盐、白胡椒粉调味。"],"tips":"萝卜后放，炖到能用筷子轻松插入就停，久了会散。","id":"beef-15","source":"内置菜谱"},{"name":"土豆焖牛腩","category":"beef","kind":"荤","minutes":100,"difficulty":2,"spicy":1,"tags":["家常","下饭","一锅出"],"ingredients":[{"name":"牛腩","amount":"600 克","group":"主料"},{"name":"土豆","amount":"3 个","group":"主料"},{"name":"豆瓣","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"冰糖","amount":"10 克","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"}],"steps":["牛腩切块焯水；土豆切大块泡水。","热油炒香姜片、八角、豆瓣，下牛腩煸炒。","淋生抽、老抽，加冰糖和热水，小火焖 70 分钟。","下土豆再焖 20 分钟，收汁。"],"tips":"土豆切大块，焖 20 分钟刚好外粉内整。","id":"beef-16","source":"内置菜谱"},{"name":"牛腩煲","category":"beef","kind":"荤","minutes":110,"difficulty":2,"spicy":1,"tags":["粤菜","宴客","冬天"],"ingredients":[{"name":"牛腩","amount":"700 克","group":"主料"},{"name":"白萝卜","amount":"400 克","group":"主料"},{"name":"腐竹","amount":"80 克","group":"主料"},{"name":"柱侯酱","amount":"2 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"冰糖","amount":"15 克","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"陈皮","amount":"1 块","group":"调料"}],"steps":["牛腩切块焯水；腐竹泡软；萝卜切块。","热油炒香姜片、八角、柱侯酱，下牛腩翻炒。","淋生抽，加冰糖、陈皮和热水，小火焖 80 分钟。","下萝卜和腐竹再焖 20 分钟。","连汤带肉转入砂锅，烧开上桌。"],"tips":"柱侯酱是广式牛腩的骨架，没有它味道就不对。","id":"beef-17","source":"内置菜谱"},{"name":"酱牛肉","category":"beef","kind":"荤","minutes":150,"difficulty":2,"spicy":1,"tags":["卤味","凉菜","下酒"],"ingredients":[{"name":"牛腱子","amount":"1000 克","group":"主料"},{"name":"黄豆酱","amount":"3 勺","group":"调料"},{"name":"生抽","amount":"4 勺","group":"调料"},{"name":"老抽","amount":"1 勺","group":"调料"},{"name":"冰糖","amount":"20 克","group":"调料"},{"name":"八角","amount":"3 个","group":"调料"},{"name":"桂皮","amount":"1 块","group":"调料"},{"name":"香叶","amount":"4 片","group":"调料"},{"name":"花椒","amount":"1 勺","group":"调料"},{"name":"姜片","amount":"6 片","group":"调料"}],"steps":["牛腱冷水泡 2 小时去血水，中途换水两次。","冷水下锅焯 5 分钟，洗净。","所有调料加 1500 毫升水煮开，放牛腱。","小火卤 90 分钟，筷子能扎透即可。","关火连汤泡 4 小时以上，冷藏后逆纹切薄片。"],"tips":"酱牛肉靠\"泡\"入味，泡一夜切片才不散、纹理漂亮。","id":"beef-18","source":"内置菜谱"},{"name":"卤牛肉","category":"beef","kind":"荤","minutes":120,"difficulty":2,"spicy":1,"tags":["卤味","凉菜","高蛋白"],"ingredients":[{"name":"牛腱子","amount":"800 克","group":"主料"},{"name":"生抽","amount":"4 勺","group":"调料"},{"name":"老抽","amount":"1 勺","group":"调料"},{"name":"冰糖","amount":"20 克","group":"调料"},{"name":"八角","amount":"3 个","group":"调料"},{"name":"桂皮","amount":"1 块","group":"调料"},{"name":"香叶","amount":"3 片","group":"调料"},{"name":"草果","amount":"1 个","group":"调料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"料酒","amount":"3 勺","group":"调料"}],"steps":["牛腱泡水 2 小时后焯水洗净。","卤水煮开，放牛腱，小火卤 80 分钟。","关火泡 2 小时。","捞出放凉，冷藏 1 小时后逆纹切片。"],"tips":"冷藏后再切，切面平整不碎；卤水过滤冷冻可反复用。","id":"beef-19","source":"内置菜谱"},{"name":"腐竹烧牛肉","category":"beef","kind":"荤","minutes":80,"difficulty":2,"spicy":1,"tags":["家常","下饭"],"ingredients":[{"name":"牛腩","amount":"500 克","group":"主料"},{"name":"腐竹","amount":"100 克","group":"主料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"半勺","group":"调料"},{"name":"冰糖","amount":"8 克","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"八角","amount":"1 个","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"}],"steps":["腐竹温水泡 40 分钟，切段；牛腩切块焯水。","热油炒香姜片、八角，下牛腩煸炒。","淋料酒、生抽、老抽，加热水，小火炖 50 分钟。","下腐竹再炖 15 分钟，收汁。"],"tips":"腐竹吸汁快，最后 15 分钟放，早了会烂成糊。","id":"beef-20","source":"内置菜谱"},{"name":"香菇烧牛肉","category":"beef","kind":"荤","minutes":80,"difficulty":2,"spicy":1,"tags":["家常","下饭"],"ingredients":[{"name":"牛腩","amount":"500 克","group":"主料"},{"name":"香菇","amount":"8 朵","group":"主料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"蚝油","amount":"1 勺","group":"调料"},{"name":"冰糖","amount":"8 克","group":"调料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"}],"steps":["香菇泡发切块，泡菇水留用；牛腩切块焯水。","热油炒香姜片和香菇，下牛腩煸炒。","淋料酒、生抽、蚝油，倒泡菇水和热水。","小火炖 60 分钟，收汁。"],"tips":"干香菇比鲜香菇香，泡菇水沉淀后取上层当高汤。","id":"beef-21","source":"内置菜谱"},{"name":"冬瓜炖牛肉","category":"beef","kind":"荤","minutes":90,"difficulty":1,"spicy":0,"tags":["清淡","汤菜","消暑"],"ingredients":[{"name":"牛腩","amount":"500 克","group":"主料"},{"name":"冬瓜","amount":"600 克","group":"主料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"料酒","amount":"2 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"白胡椒粉","amount":"少许","group":"调料"}],"steps":["牛腩切 3 厘米块，冷水下锅加料酒焯 3 分钟，撇沫后捞出用温水冲净。","牛腩、姜片入锅，加足量热水，大火烧开转小火炖 60 分钟。","冬瓜去皮切厚块，下锅炖 20 分钟至半透明。","加盐和白胡椒粉调味，撒葱花出锅。"],"tips":"冬瓜含水量高，炖 20 分钟就够，久了整锅成汤。","id":"beef-22","source":"内置菜谱"},{"name":"水煮牛肉","category":"beef","kind":"荤","minutes":40,"difficulty":3,"spicy":3,"tags":["川菜","重口","下饭"],"ingredients":[{"name":"牛里脊","amount":"400 克","group":"主料"},{"name":"豆芽","amount":"200 克","group":"主料"},{"name":"莴笋","amount":"1 根","group":"主料"},{"name":"郫县豆瓣","amount":"2 勺","group":"调料"},{"name":"干辣椒","amount":"10 个","group":"调料"},{"name":"花椒","amount":"2 勺","group":"调料"},{"name":"蒜末","amount":"4 瓣","group":"调料"},{"name":"淀粉","amount":"2 勺","group":"调料"},{"name":"蛋清","amount":"1 个","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"}],"steps":["牛肉逆纹切大薄片，加盐、蛋清、淀粉抓匀腌 20 分钟。","豆芽和莴笋片焯水，铺在碗底。","锅中炒香豆瓣、一半干辣椒和花椒，加 600 毫升水烧开。","牛肉片逐片下锅，煮到变色立刻连汤倒入碗中（约 1 分钟）。","表面铺蒜末、剩余干辣椒和花椒，浇一勺滚油。"],"tips":"牛肉只需烫到变色；滚油要烧到冒烟才浇得香。","id":"beef-23","source":"内置菜谱"},{"name":"麻婆牛肉","category":"beef","kind":"荤","minutes":25,"difficulty":2,"spicy":3,"tags":["川菜","下饭","重口"],"ingredients":[{"name":"牛肉末","amount":"200 克","group":"主料"},{"name":"嫩豆腐","amount":"1 盒","group":"主料"},{"name":"郫县豆瓣","amount":"1.5 勺","group":"调料"},{"name":"豆豉","amount":"半勺","group":"调料"},{"name":"花椒粉","amount":"1 勺","group":"调料"},{"name":"辣椒粉","amount":"1 勺","group":"调料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"}],"steps":["豆腐切块，淡盐水浸泡 5 分钟去豆味。","热油下牛肉末炒散至酥香，盛出一半。","下豆瓣、豆豉、蒜末、辣椒粉炒出红油，加 300 毫升水烧开。","下豆腐小火煮 3 分钟，回牛肉末。","分两次淋淀粉水勾芡，出锅撒花椒粉和葱花。"],"tips":"牛肉末要炒到干酥才香；勾芡分两次，汁才挂得住豆腐。","id":"beef-24","source":"内置菜谱"},{"name":"酸汤肥牛","category":"beef","kind":"荤","minutes":25,"difficulty":2,"spicy":2,"tags":["开胃","下饭","金汤"],"ingredients":[{"name":"肥牛卷","amount":"400 克","group":"主料"},{"name":"金针菇","amount":"200 克","group":"主料"},{"name":"小米辣","amount":"4 个","group":"主料"},{"name":"黄灯笼辣椒酱","amount":"2 勺","group":"调料"},{"name":"白醋","amount":"2 勺","group":"调料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"姜末","amount":"1 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["金针菇焯水铺碗底；肥牛焯水 15 秒捞出（别久煮）。","锅中少油炒香蒜姜末和黄灯笼酱，加 600 毫升水烧开。","加白醋、盐调成酸辣汤底，煮 2 分钟。","下肥牛煮 30 秒，连汤倒入碗中。","撒小米辣和葱花，浇一勺热油。"],"tips":"肥牛先焯再入汤，汤才清；黄灯笼酱是金汤酸辣的关键。","id":"beef-25","source":"内置菜谱"},{"name":"泡椒肥牛","category":"beef","kind":"荤","minutes":20,"difficulty":2,"spicy":3,"tags":["川菜","下饭","快手"],"ingredients":[{"name":"肥牛卷","amount":"400 克","group":"主料"},{"name":"泡椒","amount":"8 个","group":"主料"},{"name":"青椒","amount":"1 个","group":"主料"},{"name":"泡姜","amount":"1 块","group":"调料"},{"name":"蒜片","amount":"4 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["肥牛沸水焯 15 秒捞出。","泡椒、泡姜切段，青椒切块。","热油炒香泡椒、泡姜、蒜片。","下肥牛和青椒，淋生抽、料酒，大火翻 30 秒。"],"tips":"肥牛已经是熟的一半，回锅只要裹上味就出锅。","id":"beef-26","source":"内置菜谱"},{"name":"尖椒牛肉末","category":"beef","kind":"荤","minutes":20,"difficulty":1,"spicy":2,"tags":["快手","下饭"],"ingredients":[{"name":"牛肉末","amount":"300 克","group":"主料"},{"name":"尖椒","amount":"4 个","group":"主料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"老抽","amount":"少许","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["尖椒切碎；牛肉末加料酒抓匀。","热锅下油，牛肉末中火炒散、炒到干香出油。","加蒜末炒香，淋生抽、老抽上色。","下尖椒碎大火炒 1 分钟，调盐出锅。"],"tips":"牛肉末要炒到颗粒分明、微微焦，才没有腥味。","id":"beef-27","source":"内置菜谱"},{"name":"豆角炒牛肉末","category":"beef","kind":"荤","minutes":25,"difficulty":1,"spicy":2,"tags":["下饭","家常"],"ingredients":[{"name":"牛肉末","amount":"250 克","group":"主料"},{"name":"长豆角","amount":"300 克","group":"主料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"豆瓣","amount":"半勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"}],"steps":["豆角切小粒，沸水焯 3 分钟至断生（必须焯透）。","热油下牛肉末炒散至干香，加蒜末、豆瓣炒出红油。","下豆角粒大火炒 2 分钟。","淋生抽、料酒，调盐翻匀。"],"tips":"豆角一定要焯透，半生豆角有皂苷，吃了会不舒服。","id":"beef-28","source":"内置菜谱"},{"name":"黑椒牛排","category":"beef","kind":"荤","minutes":25,"difficulty":2,"spicy":1,"tags":["西式","宴客","高蛋白"],"ingredients":[{"name":"西冷牛排","amount":"2 块","group":"主料"},{"name":"洋葱","amount":"半个","group":"主料"},{"name":"黑胡椒碎","amount":"1 勺","group":"调料"},{"name":"黄油","amount":"20 克","group":"调料"},{"name":"蒜","amount":"3 瓣","group":"调料"},{"name":"海盐","amount":"适量","group":"调料"},{"name":"迷迭香","amount":"1 枝","group":"调料"}],"steps":["牛排提前 30 分钟从冰箱取出回温，用厨房纸吸干表面水分。","两面撒海盐和黑胡椒，轻轻按压。","铸铁锅烧到冒烟，下牛排大火每面煎 90 秒（三分熟）。","加黄油、蒜、迷迭香，用勺把黄油浇在牛排上 30 秒。","出锅静置 5 分钟再切，配炒洋葱。"],"tips":"锅要够热、肉要够干，才能煎出焦壳；静置和煎一样重要。","id":"beef-29","source":"内置菜谱"},{"name":"香煎牛排","category":"beef","kind":"荤","minutes":20,"difficulty":1,"spicy":0,"tags":["快手","西式","高蛋白"],"ingredients":[{"name":"眼肉牛排","amount":"2 块","group":"主料"},{"name":"海盐","amount":"适量","group":"调料"},{"name":"黑胡椒","amount":"适量","group":"调料"},{"name":"橄榄油","amount":"1 勺","group":"调料"},{"name":"黄油","amount":"10 克","group":"调料"}],"steps":["牛排回温 30 分钟，吸干水分，两面抹油、撒盐和黑胡椒。","平底锅大火烧热，下牛排煎 2 分钟不要动。","翻面再煎 2 分钟，边缘也立起来煎一下。","放黄油，融化后浇在表面，出锅静置 5 分钟。"],"tips":"煎的时候别来回翻，一面定型再翻才有焦壳。","id":"beef-30","source":"内置菜谱"},{"name":"铁板牛肉","category":"beef","kind":"荤","minutes":25,"difficulty":2,"spicy":2,"tags":["下饭","香气足"],"ingredients":[{"name":"牛里脊","amount":"300 克","group":"主料"},{"name":"洋葱","amount":"1 个","group":"主料"},{"name":"青红椒","amount":"各半个","group":"主料"},{"name":"黑椒汁","amount":"2 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"},{"name":"蒜末","amount":"3 瓣","group":"调料"}],"steps":["牛肉逆纹切片，加生抽、淀粉腌 15 分钟。","洋葱切圈，青红椒切块。","铁板（或厚底锅）烧到很热，刷油，铺满洋葱圈。","另起锅大火炒牛肉 40 秒，加蒜末、彩椒、黑椒汁翻匀。","立刻倒在铁板上，听那声\"滋啦\"。"],"tips":"铁板必须烧到冒烟，靠余温把洋葱和牛肉的香气顶出来。","id":"beef-31","source":"内置菜谱"},{"name":"烤牛肉串","category":"beef","kind":"荤","minutes":45,"difficulty":1,"spicy":2,"tags":["烧烤","下酒","聚会"],"ingredients":[{"name":"牛里脊","amount":"500 克","group":"主料"},{"name":"洋葱","amount":"半个","group":"主料"},{"name":"孜然粉","amount":"1 勺","group":"调料"},{"name":"辣椒粉","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"蚝油","amount":"1 勺","group":"调料"},{"name":"料酒","amount":"1 勺","group":"调料"},{"name":"食用油","amount":"2 勺","group":"调料"}],"steps":["牛肉切 2 厘米见方的块，洋葱切碎。","加所有调料和洋葱碎抓匀，冷藏腌 2 小时。","竹签提前泡水，肥瘦相间串起来，每串 4-5 块。","烤箱 220 度烤 12 分钟，中途翻面刷油。","出炉再撒一层孜然和辣椒粉。"],"tips":"串的时候夹一点肥肉，烤出来才不干；竹签泡水不会烧焦。","id":"beef-32","source":"内置菜谱"},{"name":"孜然烤牛肉","category":"beef","kind":"荤","minutes":40,"difficulty":1,"spicy":2,"tags":["烧烤","下酒"],"ingredients":[{"name":"牛里脊","amount":"400 克","group":"主料"},{"name":"洋葱","amount":"1 个","group":"主料"},{"name":"孜然粒","amount":"2 勺","group":"调料"},{"name":"辣椒粉","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"蚝油","amount":"1 勺","group":"调料"},{"name":"食用油","amount":"2 勺","group":"调料"}],"steps":["牛肉切薄片，加生抽、蚝油、油和半个洋葱抓匀，腌 30 分钟。","烤盘铺锡纸，铺满洋葱丝，牛肉片摊开。","烤箱 220 度烤 8 分钟。","撒孜然粒和辣椒粉，再烤 3 分钟。"],"tips":"牛肉片别叠在一起，摊开才能烤出焦边。","id":"beef-33","source":"内置菜谱"},{"name":"牛肉汤","category":"beef","kind":"汤","minutes":120,"difficulty":1,"spicy":0,"tags":["汤水","清淡","暖胃"],"ingredients":[{"name":"牛腱","amount":"600 克","group":"主料"},{"name":"白萝卜","amount":"300 克","group":"主料"},{"name":"姜片","amount":"6 片","group":"调料"},{"name":"葱段","amount":"2 段","group":"调料"},{"name":"八角","amount":"2 个","group":"调料"},{"name":"花椒","amount":"1 勺","group":"调料"},{"name":"白胡椒粉","amount":"少许","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["牛腱泡水 2 小时，冷水下锅焯 5 分钟，撇净浮沫。","牛肉加姜葱、八角、花椒和足量热水，小火炖 90 分钟。","萝卜切片，最后 20 分钟下锅。","加盐、白胡椒粉，撒香菜和葱花。"],"tips":"汤要清就别大滚，全程小火，浮沫随时撇。","id":"beef-34","source":"内置菜谱"},{"name":"萝卜牛肉汤","category":"beef","kind":"汤","minutes":110,"difficulty":1,"spicy":0,"tags":["汤水","清淡","冬天"],"ingredients":[{"name":"牛腩","amount":"500 克","group":"主料"},{"name":"白萝卜","amount":"500 克","group":"主料"},{"name":"姜片","amount":"5 片","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"白胡椒粉","amount":"少许","group":"调料"},{"name":"香菜","amount":"2 根","group":"调料"}],"steps":["牛腩切块焯水洗净。","加姜片和热水，小火炖 80 分钟。","下萝卜块再炖 25 分钟。","加盐、白胡椒粉，撒香菜。"],"tips":"萝卜炖到透明就好，汤会带一点回甘。","id":"beef-35","source":"内置菜谱"},{"name":"西红柿牛肉汤","category":"beef","kind":"汤","minutes":100,"difficulty":1,"spicy":0,"tags":["汤水","酸甜","开胃"],"ingredients":[{"name":"牛腩","amount":"500 克","group":"主料"},{"name":"番茄","amount":"3 个","group":"主料"},{"name":"姜片","amount":"4 片","group":"调料"},{"name":"番茄酱","amount":"1 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["牛腩切块焯水；番茄两个切块，一个打成泥。","少油炒番茄块至出沙，加番茄泥和番茄酱炒匀。","倒牛肉和热水，加姜片，小火炖 70 分钟。","加盐调味，撒葱花。"],"tips":"番茄先炒出沙再加水，汤才红亮浓郁。","id":"beef-36","source":"内置菜谱"},{"name":"牛肉粉丝汤","category":"beef","kind":"汤","minutes":40,"difficulty":1,"spicy":1,"tags":["汤水","小吃","快手"],"ingredients":[{"name":"牛里脊","amount":"200 克","group":"主料"},{"name":"粉丝","amount":"1 把","group":"主料"},{"name":"豆皮","amount":"1 张","group":"主料"},{"name":"姜片","amount":"3 片","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"白胡椒粉","amount":"半勺","group":"调料"},{"name":"香菜","amount":"2 根","group":"调料"},{"name":"辣椒油","amount":"1 勺","group":"调料"}],"steps":["牛肉切薄片，加生抽、少许淀粉腌 10 分钟。","粉丝温水泡软；豆皮切丝。","锅中水加姜片烧开，下豆皮和粉丝煮 3 分钟。","下牛肉片煮到变色（约 30 秒），加盐和白胡椒粉。","盛碗，淋辣椒油，撒香菜。"],"tips":"牛肉最后下、变色就关火，泡在汤里会继续变老。","id":"beef-37","source":"内置菜谱"},{"name":"清炒油麦菜","category":"veggie","kind":"素","minutes":10,"difficulty":1,"spicy":0,"tags":["快手","清淡","低卡"],"ingredients":[{"name":"油麦菜","amount":"400 克","group":"主料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"食用油","amount":"2 勺","group":"调料"}],"steps":["油麦菜洗净沥干，切成 5 厘米段。","锅烧热放油，下蒜末小火炒香。","大火下油麦菜，快速翻炒 40 秒至叶子塌下。","加盐翻匀，立刻出锅。"],"tips":"菜一定要沥干，带水下锅就变成水煮；全程不超过 1 分钟。","id":"veggie-01","source":"内置菜谱"},{"name":"清炒生菜","category":"veggie","kind":"素","minutes":10,"difficulty":1,"spicy":0,"tags":["快手","清淡","低卡"],"ingredients":[{"name":"生菜","amount":"400 克","group":"主料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"蚝油","amount":"半勺","group":"调料"}],"steps":["生菜掰开洗净，沥干水分。","热锅下油，蒜末炒香。","大火下生菜炒 30 秒，叶子一软就调盐和蚝油。","翻匀立刻装盘。"],"tips":"生菜 90% 是水，炒久了出一盘汤，宁短勿长。","id":"veggie-02","source":"内置菜谱"},{"name":"清炒上海青","category":"veggie","kind":"素","minutes":12,"difficulty":1,"spicy":0,"tags":["快手","清淡"],"ingredients":[{"name":"上海青","amount":"400 克","group":"主料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["上海青从根部剖开洗净，沥干；大棵的对半切。","热锅下油，蒜片炒香。","先下菜梗炒 30 秒，再下菜叶。","调盐，大火炒到叶子刚软即可。"],"tips":"梗和叶分开下锅，熟度才一致，不会梗生叶烂。","id":"veggie-03","source":"内置菜谱"},{"name":"清炒空心菜","category":"veggie","kind":"素","minutes":12,"difficulty":1,"spicy":0,"tags":["快手","清淡","夏天"],"ingredients":[{"name":"空心菜","amount":"400 克","group":"主料"},{"name":"蒜末","amount":"4 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"白醋","amount":"几滴","group":"调料"}],"steps":["空心菜掐成段，洗净沥干。","热锅多放一点油，蒜末炒香。","大火下空心菜快速翻炒 40 秒。","调盐，滴几滴白醋，翻匀出锅。"],"tips":"空心菜极易发黑，全程大火、快炒、不加盖。","id":"veggie-04","source":"内置菜谱"},{"name":"清炒菠菜","category":"veggie","kind":"素","minutes":12,"difficulty":1,"spicy":0,"tags":["快手","补铁","清淡"],"ingredients":[{"name":"菠菜","amount":"400 克","group":"主料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["菠菜洗净，沸水焯 20 秒（去草酸），捞出过凉，挤干水。","热锅下油，蒜末炒香。","下菠菜大火炒 30 秒。","调盐翻匀出锅。"],"tips":"菠菜必须焯水，草酸不除会影响钙吸收，口感也涩。","id":"veggie-05","source":"内置菜谱"},{"name":"清炒茼蒿","category":"veggie","kind":"素","minutes":10,"difficulty":1,"spicy":0,"tags":["快手","清香"],"ingredients":[{"name":"茼蒿","amount":"400 克","group":"主料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["茼蒿洗净掐段，沥干。","热锅下油，蒜末炒香。","大火下茼蒿炒 40 秒，叶子一塌就调盐。","翻匀立即出锅。"],"tips":"茼蒿有独特清香，别放酱油和鸡精，会盖住本味。","id":"veggie-06","source":"内置菜谱"},{"name":"清炒西兰花","category":"veggie","kind":"素","minutes":15,"difficulty":1,"spicy":0,"tags":["低卡","清淡","高纤维"],"ingredients":[{"name":"西兰花","amount":"1 颗","group":"主料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"蚝油","amount":"半勺","group":"调料"}],"steps":["西兰花掰小朵，淡盐水泡 10 分钟，冲净。","沸水加盐和几滴油，焯 1 分钟捞出。","热锅下油，蒜末炒香，下西兰花大火炒 1 分钟。","调盐和蚝油，翻匀出锅。"],"tips":"焯水时加油，西兰花才翠绿；焯过再炒，不会外烂内生。","id":"veggie-07","source":"内置菜谱"},{"name":"清炒花菜","category":"veggie","kind":"素","minutes":15,"difficulty":1,"spicy":0,"tags":["家常","清淡"],"ingredients":[{"name":"花菜","amount":"1 颗","group":"主料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"生抽","amount":"半勺","group":"调料"}],"steps":["花菜掰小朵，淡盐水泡 10 分钟，冲净。","沸水焯 1 分半捞出沥干。","热油爆香蒜片，下花菜大火炒 1 分钟。","调盐和生抽，翻匀。"],"tips":"花菜缝隙藏虫，淡盐水泡这一步别省。","id":"veggie-08","source":"内置菜谱"},{"name":"清炒娃娃菜","category":"veggie","kind":"素","minutes":12,"difficulty":1,"spicy":0,"tags":["快手","清淡","低卡"],"ingredients":[{"name":"娃娃菜","amount":"2 颗","group":"主料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["娃娃菜纵向切条，洗净沥干。","热锅下油，蒜末炒香。","先下菜帮炒 40 秒，再下菜叶。","调盐，炒到刚软出锅。"],"tips":"娃娃菜自带甜味，只用盐就够，别加重口调料。","id":"veggie-09","source":"内置菜谱"},{"name":"清炒小白菜","category":"veggie","kind":"素","minutes":10,"difficulty":1,"spicy":0,"tags":["快手","清淡"],"ingredients":[{"name":"小白菜","amount":"400 克","group":"主料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["小白菜洗净切段，梗叶分开，甩干水分。","热锅放油烧到微微冒烟，下蒜末炒香。","先下菜梗大火炒 30 秒至边缘变透。","下叶子炒 30 秒，调盐翻匀出锅。"],"tips":"小白菜出水多，炒前甩干水，锅要够热。","id":"veggie-10","source":"内置菜谱"},{"name":"清炒四季豆","category":"veggie","kind":"素","minutes":18,"difficulty":2,"spicy":0,"tags":["家常","下饭"],"ingredients":[{"name":"四季豆","amount":"400 克","group":"主料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"生抽","amount":"半勺","group":"调料"}],"steps":["四季豆撕去两头和老筋，掰成段，洗净。","沸水焯 3 分钟（一定要焯透），捞出沥干。","热油炒香蒜末，下四季豆大火炒 2 分钟。","调盐和生抽，翻匀。"],"tips":"四季豆不熟会中毒，焯水 3 分钟或炒到表皮起皱才安全。","id":"veggie-11","source":"内置菜谱"},{"name":"清炒荷兰豆","category":"veggie","kind":"素","minutes":12,"difficulty":1,"spicy":0,"tags":["快手","清爽"],"ingredients":[{"name":"荷兰豆","amount":"300 克","group":"主料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["荷兰豆撕去两侧老筋，洗净。","沸水加盐焯 40 秒，捞出过凉。","热油爆香蒜片，下荷兰豆大火炒 40 秒。","调盐翻匀出锅。"],"tips":"老筋必须撕掉，不然嚼不动；焯过水颜色更翠。","id":"veggie-12","source":"内置菜谱"},{"name":"酸辣土豆丝","category":"veggie","kind":"素","minutes":20,"difficulty":2,"spicy":2,"tags":["川菜","下饭","经典"],"ingredients":[{"name":"土豆","amount":"2 个","group":"主料"},{"name":"干辣椒","amount":"4 个","group":"主料"},{"name":"花椒","amount":"半勺","group":"调料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"白醋","amount":"2 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["土豆切细丝，清水冲两遍洗掉淀粉，泡在凉水里。","热锅下油，小火炒香花椒、干辣椒、蒜末。","大火下沥干的土豆丝，快速翻炒 1 分钟。","沿锅边淋 1 勺白醋，调盐。","出锅前再淋 1 勺醋，翻匀。"],"tips":"醋分两次放：一次保脆，一次提酸；淀粉不洗净就粘锅。","id":"veggie-13","source":"内置菜谱"},{"name":"干煸土豆条","category":"veggie","kind":"素","minutes":25,"difficulty":2,"spicy":2,"tags":["川菜","下饭","追剧"],"ingredients":[{"name":"土豆","amount":"3 个","group":"主料"},{"name":"芹菜","amount":"50 克","group":"主料"},{"name":"干辣椒","amount":"6 个","group":"调料"},{"name":"花椒","amount":"1 勺","group":"调料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"盐","amount":"适量","group":"调料"},{"name":"白芝麻","amount":"1 勺","group":"调料"}],"steps":["土豆切粗条，泡水去淀粉，沥干后擦干水分。","平底锅多放油，中火把土豆条煎到四面金黄、外皮微皱，盛出。","锅留底油，小火炒香干辣椒、花椒、蒜末。","下芹菜段炒 30 秒，倒回土豆条。","调盐，撒白芝麻，翻匀。"],"tips":"土豆条要擦干再煎，不然油花四溅还不脆。","id":"veggie-14","source":"内置菜谱"},{"name":"红烧茄子","category":"veggie","kind":"素","minutes":25,"difficulty":2,"spicy":1,"tags":["家常","下饭"],"ingredients":[{"name":"长茄子","amount":"2 根","group":"主料"},{"name":"青椒","amount":"1 个","group":"主料"},{"name":"番茄","amount":"1 个","group":"主料"},{"name":"蒜末","amount":"4 瓣","group":"调料"},{"name":"生抽","amount":"2 勺","group":"调料"},{"name":"老抽","amount":"少许","group":"调料"},{"name":"白糖","amount":"1 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"}],"steps":["茄子切滚刀块，撒盐腌 10 分钟，挤掉水分，拍一层薄淀粉。","多油中火把茄子煎到表面金黄、变软，盛出。","底油炒香蒜末，下番茄块炒出汁，加青椒。","倒茄子，淋生抽、老抽、糖和 3 勺水，焖 3 分钟收汁。"],"tips":"茄子先腌再拍粉，能少吸一半油，还不塌。","id":"veggie-15","source":"内置菜谱"},{"name":"鱼香茄子","category":"veggie","kind":"素","minutes":25,"difficulty":2,"spicy":2,"tags":["川菜","下饭"],"ingredients":[{"name":"长茄子","amount":"2 根","group":"主料"},{"name":"肉末","amount":"80 克","group":"主料"},{"name":"泡椒末","amount":"2 勺","group":"调料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"姜末","amount":"1 勺","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"香醋","amount":"2 勺","group":"调料"},{"name":"白糖","amount":"2 勺","group":"调料"},{"name":"淀粉","amount":"1 勺","group":"调料"}],"steps":["茄子切条，撒盐腌 10 分钟挤水；糖、醋、生抽、淀粉、3 勺水调成鱼香汁。","多油把茄子煎软至金黄，盛出。","底油炒散肉末，加泡椒、姜蒜末炒出红油。","倒茄子，淋鱼香汁，中火焖 2 分钟收汁。"],"tips":"茄子腌过再煎，吸油少、口感还糯。","id":"veggie-16","source":"内置菜谱"},{"name":"干煸豆角","category":"veggie","kind":"素","minutes":25,"difficulty":2,"spicy":2,"tags":["川菜","下饭"],"ingredients":[{"name":"长豆角","amount":"400 克","group":"主料"},{"name":"肉末","amount":"80 克","group":"主料"},{"name":"干辣椒","amount":"6 个","group":"调料"},{"name":"花椒","amount":"1 勺","group":"调料"},{"name":"蒜末","amount":"3 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["豆角撕筋掰段，洗净擦干。","中火多油，把豆角煸到表皮起皱、颜色变深，捞出。","锅留底油，下肉末炒散至干香，加干辣椒、花椒、蒜末。","倒回豆角，淋生抽，调盐，大火翻匀。"],"tips":"豆角必须煸到表皮起皱才算熟透，这一步别图快。","id":"veggie-17","source":"内置菜谱"},{"name":"手撕包菜","category":"veggie","kind":"素","minutes":12,"difficulty":1,"spicy":2,"tags":["湘菜","快手","下饭"],"ingredients":[{"name":"包菜","amount":"半颗","group":"主料"},{"name":"五花肉","amount":"50 克","group":"调料"},{"name":"干辣椒","amount":"4 个","group":"调料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"香醋","amount":"1 勺","group":"调料"},{"name":"盐","amount":"适量","group":"调料"}],"steps":["包菜用手撕成大片，洗净甩干水（一定要干）。","五花肉切薄片，干锅煸出油。","下干辣椒、蒜片炒香。","大火下包菜，快速翻炒 1 分钟。","沿锅边淋生抽和醋，调盐，翻匀出锅。"],"tips":"手撕的断面粗糙更挂味；包菜带水下锅就炒不出锅气。","id":"veggie-18","source":"内置菜谱"},{"name":"酸辣大白菜","category":"veggie","kind":"素","minutes":20,"difficulty":1,"spicy":2,"tags":["川菜","开胃","下饭"],"ingredients":[{"name":"大白菜","amount":"半颗","group":"主料"},{"name":"干辣椒","amount":"4 个","group":"调料"},{"name":"花椒","amount":"半勺","group":"调料"},{"name":"蒜片","amount":"3 瓣","group":"调料"},{"name":"生抽","amount":"1 勺","group":"调料"},{"name":"香醋","amount":"2 勺","group":"调料"},{"name":
